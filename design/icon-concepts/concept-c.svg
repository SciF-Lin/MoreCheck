<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12B8A6"/>
      <stop offset="1" stop-color="#2E9E5B"/>
    </linearGradient>
    <!-- 用遮罩在白色日历上挖出对勾，透出青绿底色 -->
    <mask id="calMask">
      <rect x="262" y="316" width="500" height="430" rx="76" fill="#FFFFFF"/>
      <path d="M372 536 L468 632 L660 440" fill="none" stroke="#000000"
            stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <!-- 青绿圆角方底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bgC)"/>
  <!-- 日历顶部两个挂环 -->
  <rect x="388" y="252" width="44" height="120" rx="22" fill="#FFFFFF"/>
  <rect x="592" y="252" width="44" height="120" rx="22" fill="#FFFFFF"/>
  <!-- 日历主体 + 镂空对勾 -->
  <rect x="262" y="316" width="500" height="430" rx="76" fill="#FFFFFF" mask="url(#calMask)"/>
</svg>
