    this.dom.statsClose.addEventListener('click', () => this.closeStats());

                   
    document.addEventListener('keydown', (e) => this.onKeyDown(e));

                     
                                                                   
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        if (this.pageState === 'PLAYING') this.pause({ silent: true });
        this.flushSave();
      }
    });
    // 2026-10-22：Android WebView 里 Activity 被切走 / 被系统回收时，
    // `pagehide` 不一定会发；`visibilitychange` 更可靠（页面进入 hidden 即触发）。
    // 两者都挂上，代价只是一次 localStorage 写入。
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') this.flushSave();
    });
    window.addEventListener('pagehide', () => this.flushSave());
    window.addEventListener('beforeunload', () => this.flushSave());
  }

                                                       

   
                                 
                               
     
  elapsedMs() {
    if (!this.timer.running) return this.timer.accumulated;
    return this.timer.accumulated + (Date.now() - this.timer.baseline);
  }

  timerStart() {
    if (this.timer.running) return;
    this.timer.baseline = Date.now();
    this.timer.running = true;
    this.updateTimerDisplay();
  }

                                            
  timerFreeze() {
    if (this.timer.running) {
      this.timer.accumulated += Date.now() - this.timer.baseline;
      this.timer.running = false;
    }
    this.updateTimerDisplay();
  }

  timerReset() {
    this.timer.accumulated = 0;
    this.timer.running = false;
    this.updateTimerDisplay();
  }

                                   
  timerRestore(elapsedMs) {
    this.timer.accumulated = Math.max(0, elapsedMs);
    this.timer.running = false;
    this.updateTimerDisplay();
  }

   
                         
                                          
     
  startTimerLoop() {
    this.timer.handle = setInterval(() => {
      if (this.pageState === 'PLAYING' && this.timer.running) {
        this.updateTimerDisplay();
      }
    }, 250);
  }

  updateTimerDisplay() {
                                             
    this.dom.timerEl.setAttribute('aria-live', 'off');
    this.dom.timerEl.textContent = formatDuration(this.elapsedMs());
    this.dom.timerEl.hidden = !this.settings.timerVisible;
  }

                                                      

  renderMenu() {
    this.pageState = 'MENU';
    this.dom.menu.hidden = false;
    this.dom.game.hidden = true;
    this.hideOverlay(this.dom.pauseOverlay);
    this.hideOverlay(this.dom.completeOverlay);

            
    this.dom.menuList.innerHTML = '';
    for (const band of DIFFICULTY_BANDS) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'difficulty';
      btn.setAttribute('role', 'radio');
      const selected = band.id === this.lastDifficulty;
      btn.setAttribute('aria-checked', selected ? 'true' : 'false');
      btn.classList.toggle('difficulty--active', selected);
      btn.innerHTML = `<span class="difficulty__label">${band.label}</span>`;
      btn.addEventListener('click', () => {
        this.lastDifficulty = band.id;
        this.storage.saveLastDifficulty(band.id);
        this.renderMenu();
      });
      this.dom.menuList.appendChild(btn);
    }
    this.dom.menuList.setAttribute('role', 'radiogroup');
    this.dom.menuList.setAttribute('aria-label', '难度选择');

                                      
    const save = this.storage.loadSave();
    this.dom.continueBtn.hidden = save === null;
    // 2026-10-22：继续按钮上直接写明"存的是哪一局"，用户才知道点下去会发生什么。
    if (save) {
      const band = DIFFICULTY_BANDS.find((b) => b.id === save.puzzle.difficulty);
      const ms = save.progress.elapsedMs || 0;
      const mm = String(Math.floor(ms / 60000)).padStart(2, '0');
      const ss = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
      this.dom.continueBtn.textContent =
        `继续本局（${band ? band.label : '未知难度'} · ${mm}:${ss}）`;
    } else {
      this.dom.continueBtn.textContent = '继续本局';
    }

    if (this.storage.noPersistMode) {
      this.dom.statusLeft.textContent = '本次进度不会保存';
    } else {
      this.dom.statusLeft.textContent = '';
    }
    if (this.storage.notice) {
      this.showToast(this.storage.notice);
      this.storage.notice = '';
    }
  }

                                                       

   
          
    
                                                   
                                                          
                                                         
     
  async newGame(bandId) {
    if (this.generating) return;
    if (!VALID_BANDS.includes(bandId)) bandId = 'medium';
    this.generating = true;
    this.showLoading(true);
    this.dom.newGameBtn.disabled = true;
    this.dom.newGameBtn.textContent = '正在生成…';

    const seed = (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0;
    let result = null;
    let usedWorker = false;

    try {
      result = await this.generateWithWorker(bandId, seed);
      usedWorker = result !== null;
    } catch {
      result = null;
    }

    if (result === null) {
                           
      result = await this.generateChunked(bandId, seed);
    }

    this.generating = false;
    this.showLoading(false);
    this.dom.newGameBtn.disabled = false;
    this.dom.newGameBtn.textContent = '开始新局';
    if (!result || result.error) {
      this.showToast('已生成当前可用的最高难度盘面');
      if (!result) return;
    }

                                   
    const achieved = VALID_BANDS.includes(result.difficulty.band)
      ? result.difficulty.band
      : bandId;

    this.puzzleMeta = {
      id: `${Date.now().toString(36)}-${(seed >>> 0).toString(36)}`,
      seed: result.seed,
      difficulty: bandId,
      difficultyAchieved: achieved,
      degraded: false,
      givens: result.puzzle,
      solution: result.solution,
    };

    this.puzzleState = createPuzzleState({
      givens: result.puzzle,
      solution: result.solution,
      difficulty: bandId,
    });

                            
    this.selected = this.puzzleState.values.findIndex((v, i) => v === 0 && this.puzzleState.status[i] === 0);
    if (this.selected < 0) this.selected = 0;
    this.mode = MODE.NUMBER;
    this.manualCheckActive = false;
    this.fullWarnedForRound = false;
    this.completionRecorded = false;
    this.lastDigit = 0;
    this.timerReset();

                                                    
    countPlayed(this.stats, achieved);
    this.storage.saveStats(this.stats);
    this.storage.saveLastDifficulty(bandId);
    this.flushSave();

    this.pageState = 'PLAYING';
    this.dom.menu.hidden = true;
    this.dom.game.hidden = false;
    this.hideOverlay(this.dom.completeOverlay);
    this.hideOverlay(this.dom.pauseOverlay);
    this.applySettings();
    this.renderAll();
    this.timerStart();
  }

   
                 
    
                                                       
                                                       
                                                 
                             
     
  generateWithWorker(bandId, seed) {
    return new Promise((resolve, reject) => {
      if (!this.workerUrl) { reject(new Error('worker-unavailable')); return; }
      let worker;
      try {
        worker = new Worker(this.workerUrl);
      } catch (e) {
        reject(e);
        return;
      }
      const timer = setTimeout(() => {
        worker.terminate();
        reject(new Error('worker-timeout'));
      }, 8000);
      worker.onmessage = (e) => {
        clearTimeout(timer);
        worker.terminate();
        resolve(e.data);
      };
      worker.onerror = (e) => {
        clearTimeout(timer);
        worker.terminate();
        reject(new Error('worker-error'));
      };
      worker.postMessage({ difficulty: bandId, seed, id: 1 });
    });
  }

   
                                                   
                                                    
     
  async generateChunked(bandId, seed) {
    const TRIES = 10;
    let best = null;
    for (let t = 0; t < TRIES; t++) {
      await new Promise((r) => requestAnimationFrame(r));
      const cand = generatePuzzle({
        difficulty: bandId,
        tries: 1,
        seed: (seed + t * 0x9e3779b9) >>> 0,
      });
      if (best === null || cand.difficulty.score > best.difficulty.score) best = cand;
      this.dom.loadingText.textContent = '正在生成…';
    }
    return best;
  }

                                                      

  continueGame() {
    const save = this.storage.loadSave();
    if (save === null) {
      this.renderMenu();
      return;
    }

                                      
                       
    if (!hasUniqueSolution(save.puzzle.solution).unique) {
      this.storage.clearSave();
      this.showToast('上次的进度无法读取，已开始新局');
      this.renderMenu();
      return;
    }

    this.puzzleMeta = save.puzzle;
    this.puzzleState = createPuzzleState({
      givens: save.puzzle.givens,
      solution: save.puzzle.solution,
      difficulty: save.puzzle.difficulty,
    });

                
    const values = Uint8Array.from(save.progress.values);
    const status = Uint8Array.from(save.progress.status);
    const notes = Int16Array.from(save.progress.notes);
    this.puzzleState = {
      values,
      status,
      notes,
      givens: Uint8Array.from(save.puzzle.givens),
      solution: Uint8Array.from(save.puzzle.solution),
      difficulty: save.puzzle.difficulty,
      createdAt: save.progress.startedAt || Date.now(),
    };

    this.selected = this.puzzleState.values.findIndex((v, i) => v === 0 && this.puzzleState.status[i] === 0);
    if (this.selected < 0) this.selected = 0;
    this.mode = MODE.NUMBER;
    this.manualCheckActive = false;
    this.fullWarnedForRound = false;
    this.completionRecorded = false;
    this.lastDigit = 0;

                                         
    this.timerRestore(save.progress.elapsedMs);

    this.pageState = 'PLAYING';
    this.dom.menu.hidden = true;
    this.dom.game.hidden = false;
    this.applySettings();
    this.renderAll();
    this.timerStart();
  }

                                                      

  onSelectCell(idx, opts = {}) {
    if (this.pageState !== 'PLAYING' && this.pageState !== 'PAUSED') return;
    if (this.pageState !== 'PLAYING') return;
                                                
    if (this.puzzleState.status[idx] === 1) {
      if (opts && opts.provisional) {
                            
        this.selected = -1;
        this.renderBoard();
      }
      return;
    }
    this.selected = idx;
                          
    this.renderAll();
  }

   
                                  
                                               
                                
     
  onContextNote(idx) {
    if (this.pageState !== 'PLAYING') return;
    if (this.puzzleState.status[idx] === 1) return;
    if (this.lastDigit === 0) {
      this.showToast('先用数字键选择要记的数字');
      return;
    }
    this.selected = idx;
    this.applyNote(this.lastDigit);
  }

  onLongPressErase(idx) {
    if (this.pageState !== 'PLAYING') return;
    if (this.puzzleState.status[idx] === 1) return;
    this.selected = idx;
    this.applyErase();
  }

  setMode(mode) {
    this.mode = mode;
                         
    this.renderKeypad();
  }

  onDigitKey(d) {
    if (this.pageState !== 'PLAYING') return;
                            
    this.lastDigit = d;
    if (this.selected < 0) return;                          
    // ⚠️ 2026-10-22 修复：原先只分了「笔记 / 非笔记」两种，`MODE.ERASE`
    // （擦除模式）落进了 else → 调的是 applyValue(d)：点数字键不但不擦，
    // 反而把该数字填进了格子。用户报的"笔记无法擦除"就是这条的可见后果
    // （擦除模式下想擦掉笔记，结果填了个数字，笔记也跟着被覆盖）。
    if (this.mode === MODE.NOTE) this.applyNote(d);
    else if (this.mode === MODE.ERASE) this.applyErase();
    else this.applyValue(d);
                                       
  }

                          

  applyValue(d) {
    const idx = this.selected;
    if (idx < 0) return;
    if (this.puzzleState.status[idx] === 1) return;                 
                                                                         
    const r = setUserValue(this.puzzleState, idx, d);
    if (!r.accepted) {
                                            
                                
      return;
    }
                                         
                     
    this.puzzleState = r.state;
    this.afterMutation();
  }

  applyNote(d) {
    const idx = this.selected;
    if (idx < 0) return;
    if (this.puzzleState.status[idx] === 1) return;
    if (this.puzzleState.values[idx] !== 0) return;                
                                                           
    this.puzzleState = toggleNote(this.puzzleState, idx, d);
    this.afterMutation();
  }

  applyErase() {
    const idx = this.selected;
    if (idx < 0) return;
    if (this.puzzleState.status[idx] === 1) return;                    
                                        
    this.puzzleState = clearCell(this.puzzleState, idx);
                                  
    this.afterMutation();
  }

                    
  afterMutation() {
    this.manualCheckActive = false;                     
    this.renderAll();
    this.scheduleSave();
    this.checkCompletion();
  }

                                                        

  checkCompletion() {
                                               
    const progress = getProgress(this.puzzleState);
    if (progress.filled !== 81) return;

    const truth = this.conflictTruthSet();
    if (truth.size > 0) {
                                                    
      if (!this.fullWarnedForRound) {
        this.fullWarnedForRound = true;
        this.showToast('盘面已填满，但与唯一解不一致。请检查你的填写与笔记。');
      }
      return;
    }

    if (!isSolved(this.puzzleState)) return;
    this.onSolved();
  }

  onSolved() {
    if (this.pageState === 'COMPLETED') return;
    this.pageState = 'COMPLETED';
    this.timerFreeze();                                     

                              
                                                    
                                                         
                                          
                                                       
    const bandForStats = this.puzzleMeta.difficultyAchieved;
    const bandForDisplay = this.puzzleMeta.difficulty;
    const elapsed = this.elapsedMs();
    const completedAt = Date.now();

                      
    if (!this.completionRecorded) {
      this.completionRecorded = true;
      const isRecord = countCompleted(this.stats, { band: bandForStats, elapsedMs: elapsed, completedAt });
      this.storage.saveStats(this.stats);
                                      
      this.storage.clearSave();
      if (this.saveTimer !== null) {
        clearTimeout(this.saveTimer);
        this.saveTimer = null;
      }
      this.showCompletePanel(elapsed, bandForDisplay, isRecord);
    }
  }

  showCompletePanel(elapsed, band, isRecord) {
    const label = DIFFICULTY_BANDS.find((b) => b.id === band);
    const seed = this.puzzleMeta.seed;
    this.dom.completeBody.innerHTML =
      `<p class="complete__time">${formatDuration(elapsed)}</p>` +
      (isRecord ? '<p class="complete__record">新纪录</p>' : '') +
      `<dl class="complete__meta">` +
      `<div><dt>难度</dt><dd>${label ? label.label : band}</dd></div>` +
      `<div><dt>种子</dt><dd>${seed}</dd></div>` +
      `</dl>`;
    this.showOverlay(this.dom.completeOverlay);
  }

                                                      

  pause(opts = {}) {
    if (this.pageState !== 'PLAYING') return;
    this.pageState = 'PAUSED';
    this.timerFreeze();                          
    this.flushSave();                                 
    if (!opts.silent) this.showPauseOverlay();
  }

  resume() {
    if (this.pageState !== 'PAUSED') return;
    this.pageState = 'PLAYING';
    this.hideOverlay(this.dom.pauseOverlay);
                             
    this.timerStart();
    this.renderAll();
  }

  quitToMenu() {
    if (this.pageState === 'PLAYING' || this.pageState === 'PAUSED') {
      this.timerFreeze();
      this.flushSave();                                   
    }
    this.stats = this.storage.loadStats();
    this.renderMenu();
  }

  runManualCheck() {
                                   
    const mistakes = getMistakes(this.puzzleState);
    this.manualCheckActive = mistakes.length > 0;
                              
    this.dom.pauseStats.textContent = mistakes.length === 0
      ? '与唯一解一致'
      : `${mistakes.length} 处不一致`;
    this.renderBoard();
  }

                                                             

                              
  conflictTruthSet() {
    return computeConflictTruth(this.puzzleState.values);
  }

                                     
  conflictVisualSet() {
    return presentConflicts(this.conflictTruthSet(), {
      errorHints: this.settings.errorHints,
      manualCheckActive: this.manualCheckActive,
    });
  }

                                                      

  renderAll() {
    this.renderBoard();
    this.renderKeypad();
    this.renderStatus();
    this.updateTimerDisplay();
  }

  renderBoard() {
    const values = this.puzzleState.values;
    const selected = this.selected >= 0 && this.puzzleState.status[this.selected] !== 1
      ? this.selected
      : this.selected;

                                  
    const highlight = computeHighlight(values, selected, this.settings);

    renderBoard(this.dom.board, {
      values,
      status: this.puzzleState.status,
      notes: this.puzzleState.notes,
      selected,
      highlight,
      conflicts: this.conflictVisualSet(),
      focusIndex: selected,
    });
  }

  renderKeypad() {
    const remaining = remainingCounts(this.puzzleState.values);
                                          
    let noteState = null;
    if (this.mode === MODE.NOTE && this.selected >= 0) {
      const mask = this.puzzleState.notes[this.selected];
      noteState = {};
      for (let d = 1; d <= 9; d++) noteState[d] = (mask & (1 << (d - 1))) !== 0;
    }
    updateKeypad(this.keypadRefs, { remaining, mode: this.mode, noteState });
  }

  renderStatus() {
    const progress = getProgress(this.puzzleState);
    const empty = 81 - progress.filled;
    this.dom.statusLeft.textContent = `剩余 ${empty} / 81`;
                                          
    const label = DIFFICULTY_BANDS.find((b) => b.id === this.puzzleMeta.difficulty);
    this.dom.statusRight.textContent =
      `${label ? label.label : ''} · 种子 ${this.puzzleMeta.seed}`;
  }

                                                      

  scheduleSave() {
    if (this.saveTimer !== null) clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => {
      this.saveTimer = null;
      this.flushSave();
    }, SAVE_DEBOUNCE_MS);
  }

   
                              
                             
                                                           
     
  flushSave() {
    if (this.pageState === 'COMPLETED') return;                 
    if (!this.puzzleState || !this.puzzleMeta) return;
    if (this.saveTimer !== null) {
      clearTimeout(this.saveTimer);
      this.saveTimer = null;
    }
                       
    const snapshotElapsed = this.elapsedMs();
    const notesArr = [];
    for (let i = 0; i < 81; i++) {
      const mask = this.puzzleState.notes[i];
      const arr = [];
      if (mask !== 0) {
        for (let d = 1; d <= 9; d++) if (mask & (1 << (d - 1))) arr.push(d);
      }
      notesArr.push(arr);
    }
    this.storage.saveGame({
      puzzle: {
        id: this.puzzleMeta.id,
        seed: this.puzzleMeta.seed,
        difficulty: this.puzzleMeta.difficulty,
        difficultyAchieved: this.puzzleMeta.difficultyAchieved,
        degraded: this.puzzleMeta.degraded,
        givens: Array.from(this.puzzleMeta.givens),
        solution: Array.from(this.puzzleMeta.solution),
      },
      progress: {
        values: Array.from(this.puzzleState.values),
        status: Array.from(this.puzzleState.status),
        notes: notesArr,
                                    
        elapsedMs: snapshotElapsed,
        startedAt: this.puzzleState.createdAt,
        lastMoveAt: Date.now(),
      },
      completion: null,
    });
  }

                                                      

  applySettings() {
    document.body.classList.toggle('no-timer', !this.settings.timerVisible);
    this.updateTimerDisplay();
  }

  openSettings() {
    const defs = [
      { key: 'highlightPeers', label: '同行列宫高亮' },
      { key: 'highlightSameDigit', label: '相同数字高亮' },
      { key: 'errorHints', label: '错误提示' },
      { key: 'timerVisible', label: '显示计时器' },
    ];
    this.dom.settingsBody.innerHTML = '';
    // 2026-10-22：设置项一直是"拨了就存"，但界面上没有任何交代，
    // 用户会去找"保存"按钮。这里给一行说明（不新增按钮，避免出现两个真相）。
    const hint = document.createElement('p');
    hint.className = 'setting__hint';
    hint.textContent = '设置会被自动保存，下次打开仍然生效';
    this.dom.settingsBody.appendChild(hint);
    for (const def of defs) {
      const row = document.createElement('div');
      row.className = 'setting';
      const id = `set-${def.key}`;
      row.innerHTML =
        `<label class="setting__label" for="${id}">${def.label}</label>` +
        `<input class="setting__toggle" type="checkbox" id="${id}" role="switch" ` +
        `aria-checked="${this.settings[def.key] ? 'true' : 'false'}" ${this.settings[def.key] ? 'checked' : ''}>`;
      const input = row.querySelector('input');
      input.addEventListener('change', () => {
        this.settings[def.key] = input.checked;
        input.setAttribute('aria-checked', input.checked ? 'true' : 'false');
                                             
        this.storage.saveSettings(this.settings);
        this.applySettings();
        if (this.puzzleState) this.renderAll();
      });
      this.dom.settingsBody.appendChild(row);
    }
    this.showOverlay(this.dom.settingsOverlay);
  }

  closeSettings() { this.hideOverlay(this.dom.settingsOverlay); }

  openStats() {
                                  
    renderStats(this.dom.statsBody, {
      stats: this.stats,
      noPersistMode: this.storage.noPersistMode,
    });
    this.showOverlay(this.dom.statsOverlay);
  }

  closeStats() { this.hideOverlay(this.dom.statsOverlay); }

                                                          

  onKeyDown(e) {
                   
    if (e.key === 'Escape') {
      if (!this.dom.settingsOverlay.hidden) { this.closeSettings(); return; }
      if (!this.dom.statsOverlay.hidden) { this.closeStats(); return; }
      if (this.pageState === 'PAUSED') { this.resume(); return; }
      if (this.pageState === 'PLAYING') { e.preventDefault(); this.pause(); return; }
      return;
    }

    if (this.pageState === 'COMPLETED') {
      if (e.key === 'Enter') { e.preventDefault(); this.dom.againBtn.click(); }
      return;
    }

    if (this.pageState === 'MENU') return;

    if (this.pageState === 'PAUSED') return;

                      
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      this.pause();
      return;
    }

                     
    if (e.key === 'n' || e.key === 'N') {
      e.preventDefault();
      this.setMode(this.mode === MODE.NOTE ? MODE.NUMBER : MODE.NOTE);
      return;
    }

                        
    const dirs = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (dirs[e.key]) {
      e.preventDefault();
      if (this.selected < 0) this.selected = 0;
      const [dr, dc] = dirs[e.key];
      this.selected = moveSelection(
        this.selected, dr, dc, this.puzzleState.values, e.shiftKey
      );
      this.renderAll();
      return;
    }

                   
    if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
      e.preventDefault();
      this.applyErase();
      return;
    }

                   
    if (e.key >= '1' && e.key <= '9') {
      e.preventDefault();
      const d = Number(e.key);
      this.lastDigit = d;
      if (e.shiftKey) {
                             
        if (this.selected >= 0 && this.puzzleState.status[this.selected] !== 1) {
          this.selected = this.selected;
          this.applyNote(d);
        }
      } else {
        this.onDigitKey(d);
      }
    }
  }

                                                         

  showOverlay(el) {
    el.hidden = false;
                       
    const first = el.querySelector('button, [href], input, [tabindex]:not([tabindex="-1"])');
    if (first) first.focus();
  }

  hideOverlay(el) { el.hidden = true; }

  showLoading(on) {
    this.dom.loading.hidden = !on;
    if (on) this.dom.loadingText.textContent = '正在生成…';
  }

  showToast(text) {
    const el = this.dom.toast;
    el.textContent = text;
    el.hidden = false;
    el.setAttribute('role', 'status');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => { el.hidden = true; }, 4000);
  }

  showPauseOverlay() {
    this.dom.pauseStats.textContent = '';
    this.showOverlay(this.dom.pauseOverlay);
  }

                                                        

   
                                   
                                                                 
                                                  
     
  exposeDebugHooks() {
    const self = this;
    window.__sudoku = {
                                                                    
      countSolutions(board, limit = 2) {
        return countSolutions(board, limit);
      },
      generatePuzzle(opts) {
        const r = generatePuzzle(opts);
        return {
          puzzle: Array.from(r.puzzle),
          solution: Array.from(r.solution),
          score: r.difficulty.score,
          band: r.difficulty.band,
          bandLabel: r.difficulty.bandLabel,
          seed: r.seed,
        };
      },
      getState() {
        if (!self.puzzleState) return null;
        return {
          values: Array.from(self.puzzleState.values),
          status: Array.from(self.puzzleState.status),
          notes: Array.from(self.puzzleState.notes),
          selected: self.selected,
          mode: self.mode,
          pageState: self.pageState,
          elapsedMs: self.elapsedMs(),
          settings: { ...self.settings },
        };
      },
      setState(snapshot) {
        if (!snapshot) return false;
        if (snapshot.values) self.puzzleState.values = Uint8Array.from(snapshot.values);
        if (snapshot.status) self.puzzleState.status = Uint8Array.from(snapshot.status);
        if (snapshot.notes) self.puzzleState.notes = Int16Array.from(snapshot.notes);
        if (typeof snapshot.selected === 'number') self.selected = snapshot.selected;
        if (snapshot.mode) self.mode = snapshot.mode;
        if (typeof snapshot.elapsedMs === 'number') self.timerRestore(snapshot.elapsedMs);
        self.renderAll();
        return true;
      },
                                             
      verifyCurrent() {
        if (!self.puzzleState) return null;
        return countSolutions(self.puzzleState.values, 2);
      },
                     
      _internals: {
        get conflictTruth() { return Array.from(self.conflictTruthSet()); },
        get conflictVisual() { return Array.from(self.conflictVisualSet()); },
        get progress() { return self.puzzleState ? getProgress(self.puzzleState) : null; },
        get savedSave() { return window.localStorage.getItem('sudoku.v1.save'); },
        get storage() { return self.storage; },
        get timer() { return { ...self.timer, elapsed: self.elapsedMs() }; },
        get puzzleMeta() { return self.puzzleMeta; },
      },
             
      newGame: (band) => self.newGame(band),
      select: (i) => { self.selected = i; self.renderAll(); },
      press: (d) => self.onDigitKey(d),
      erase: () => self.applyErase(),
      setMode: (m) => self.setMode(m),
      flushSave: () => self.flushSave(),
    };
  }
}

return { App };
});


// ══════════════ 引擎入口 ══════════════
var ENGINE = __req('index.js');

// 内联打包完整性断言。
// 工程线曾踩过：正则扫 export 收集符号名时把注释当成符号名，createPuzzleState
// 静默丢失，而符号总数恰好仍是 71 —— 最容易骗过"数量对上了"的检查。
// 所以这里断言的是「必需符号逐个存在」，不是「总数等于某个数」。
(function () {
  var REQUIRED = ['generatePuzzle', 'createPuzzleState', 'setUserValue', 'toggleNote',
    'boardToString', 'countSolutions', 'solve', 'DIFFICULTY_BANDS', 'snapshot', 'restore'];
  var missing = REQUIRED.filter(function (k) { return typeof ENGINE[k] === 'undefined'; });
  if (missing.length) console.error('[sudoku] 内联引擎符号缺失:', missing);
  console.assert(missing.length === 0, '内联引擎导出符号不完整: ' + missing.join(','));
})();

// ══════════════ Worker（http 下可用，file:// 下自动降级）══════════════
var WORKER_BODY = "/**\n * worker.js —— 题目生成 Worker\n *\n * 引擎实测：expert/master 档生成 P90 为 90–136ms，超一帧预算 5–8 倍，\n * 桌面端会明显冻结；移动端更慢（2-4 倍）。必须异步。\n *\n * 引擎是纯逻辑、零 DOM 依赖、无 Node 专属 API（已实测确认不含\n * document / window / navigator / require / process），可直接放进 Worker\n * 无需任何代码改动。\n *\n * 传输用 Transferable：Uint8Array 的 buffer 零拷贝转移。\n */\n\nconst { generatePuzzle } = __ENGINE__;\n\nself.onmessage = (e) => {\n  const { difficulty, seed, id } = e.data;\n  try {\n    const result = generatePuzzle({ difficulty, seed });\n    self.postMessage(\n      {\n        ok: true,\n        id,\n        puzzle: result.puzzle,\n        solution: result.solution,\n        difficulty: {\n          score: result.difficulty.score,\n          band: result.difficulty.band,\n          bandLabel: result.difficulty.bandLabel,\n          holes: result.difficulty.holes,\n          given: result.difficulty.given,\n          unique: result.difficulty.unique,\n        },\n        seed: result.seed,\n        holes: result.holes,\n      },\n      // Transferable：零拷贝。转出后主线程拿到的是原 buffer\n      [result.puzzle.buffer, result.solution.buffer]\n    );\n  } catch (err) {\n    self.postMessage({ ok: false, id, error: String(err && err.message || err) });\n  }\n};\n";
var WORKER_URL = null;
try {
  if (WORKER_BODY) {
    var full = WORKER_BODY + '\n//# sourceURL=sudoku-worker.js';
    var blob = new Blob([full], { type: 'text/javascript' });
    WORKER_URL = URL.createObjectURL(blob);
  }
} catch (e) { WORKER_URL = null; }

// ══════════════ 启动 ══════════════
function boot() {
  var App = __req('app.js').App;
  var app = new App({
    menu: document.getElementById('menu'),
    game: document.getElementById('game'),
  });
  // 把 Worker 入口挂给 app，供策略 A 使用；失败则 app 走策略 C 降级
  app.workerUrl = WORKER_URL;
  app.engine = ENGINE;
  app.start();
  window.__sudokuApp = app;
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
})();

</script>

<script>
/* ============================================================================
   视口单位兼容修正（v1.1.78，Android WebView）
   ----------------------------------------------------------------------------
   背景：部分 WebView 内核（实测 Android 13 模拟器）把「布局视口」的高度记为 0，
   于 CSS 里 `100vh` / `100dvh` 恒等于 0、`matchMedia` 的 height 特性恒为 0，
   而 `window.innerHeight` 却是正常的（如 746）。

   这一页的尺寸体系完全建立在 vh/dvh 上：
   - `--cell` 的高度约束项 → 求值为负数 → 被 clamp 压到 24px 下限（棋盘缩成一团）；
   - `--key-min` / `--mode-h` → 压到 44px 下限（键盘挤成一条）；
   - `body` 的 `height:100dvh` → 0（键盘贴不到底）。
   同时 `max-height` 媒体查询恒为真，还会误命中「矮视口」分支。

   做法：先**特性探测**（量一个 100vh 的空 div）。只有确实坏掉时才用
   `innerHeight` / `innerWidth` 把上面几个自定义属性按页面原有公式重算成像素值；
   在正常浏览器里探测通过，本段一行都不生效，页面行为与之前完全一致。
   ========================================================================== */
(function () {
  function vhIsBroken() {
    var probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;left:0;top:0;width:1px;height:100vh';
    document.body.appendChild(probe);
    var height = probe.getBoundingClientRect().height;
    document.body.removeChild(probe);
    return height < 10;
  }

  if (!vhIsBroken()) return;

  function applyMetrics() {
    var vh = window.innerHeight;
    var vw = window.innerWidth;
    if (vh < 10 || vw < 10) return;

    /* 与样式表里 :root 的公式逐项一致（改那里时要同步改这里）：
       --key-min: clamp(44px, 7vh, 66px)
       --mode-h : clamp(44px, 5.6vh, 48px)
       --hud-h  : 168px + mode-h + 3 * key-min
       --cell   : clamp(24px, min((avail-w-10)/9, (vh-hud-10)/9), 62px)
       （--avail-w = 视口宽 - 2*8px 边距；安全区按 0 计，WebView 里为 0） */
    var keyMin = Math.min(66, Math.max(44, vh * 0.07));
    var modeH = Math.min(48, Math.max(44, vh * 0.056));
    var hud = 168 + modeH + 3 * keyMin;
    var availW = vw - 16;
    var cell = Math.min(62, Math.max(24, Math.min((availW - 10) / 9, (vh - hud - 10) / 9)));

    var root = document.documentElement.style;
    root.setProperty('--key-min', keyMin + 'px');
    root.setProperty('--mode-h', modeH + 'px');
    root.setProperty('--hud-h', hud + 'px');
    root.setProperty('--cell', cell + 'px');
    /* body 的 height/min-height:100dvh 同样为 0：改为实际视口高度，
       这样「键盘贴底 + 页面不满溢」的既有布局意图才成立。 */
    document.body.style.height = vh + 'px';
    document.body.style.minHeight = vh + 'px';

    /* 弹层（设置 / 统计 / 暂停 / 完成）的 `.panel` 写的是 `max-height: 85vh/85dvh`，
       在 vh 恒为 0 的 WebView 里会塌成 0 高——表现为"点设置后只看到一条、按钮没了"。
       改成相对父级（.overlay 是 fixed inset:0，所以 85% = 屏幕高度的 85%）即可。 */
    if (!window.__cimPanelFix) {
      window.__cimPanelFix = true;
      var style = document.createElement('style');
      style.textContent = '.panel { max-height: 85% !important; }';
      document.head.appendChild(style);
    }
  }

  applyMetrics();
  window.addEventListener('resize', applyMetrics);
  window.addEventListener('orientationchange', function () { setTimeout(applyMetrics, 120); });
})();
</script>
