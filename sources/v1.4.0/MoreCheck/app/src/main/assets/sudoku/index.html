<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- MoreCheck 云同步（v3）：把云端拉下来的游戏存档灌进 localStorage。
     必须在本页自身脚本读取 localStorage 之前执行，因此放在 <head> 最前面。
     没有待灌入快照时整段静默跳过。 -->
<script>
(function(){try{var b=window.__CIM_GAME__;if(!b)return;var p=b.pendingState();if(p){var d=JSON.parse(p);for(var k in d){try{localStorage.setItem(k,d[k]);}catch(e){}}b.markApplied();}}catch(e){}})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数独 Sudoku</title>
<style>
/* ==========================================================================
   数独 · 主样式
   --------------------------------------------------------------------------
   配色权威来源：design/art/sudoku-visual-identity.md §8.4（v1.3 权威版，
   13 个独立色相值）。⚠️ 该文档 §1 是已废弃的旧蓝色系，本文件不使用。
   UX 规格 §2.2 的 13 色色板为准。

   三个关键约束（改样式前必读）：
   1. peer 高亮走**填充通道**（格内面积），不走描边。描边无法调节强度，
      填充可以；且线条在格**之间**、填充在格**内部**，物理上不可能混淆。
   2. same-digit 的 **4px 圆点是承重结构**，不是装饰。peer 与 same-digit
      正常视觉下分离度仅 1.57:1、红色盲 1.43:1，颜色和粗细都区分不开，
      圆点是唯一区分通道，不得省略。
   3. 焦点环**按表面亮度**反转，不按元素类型。判断依据是当前表面的亮度：
      白环在琥珀填充上仅 1.34:1、青色上 1.51:1，不反转就 fail。
   ========================================================================== */

:root {
  /* ===== 颜色：13 独立色相值（勿增）=====
     peer 两色为 #E8EDF5 的 alpha 派生，非新色相值 */
  --c-bg: #12151C;            /* 页面底 / 深色焦点环 */
  --c-cell: #171B25;          /* 格位底（统一，given 不再另设底色） */
  --c-key: #1C2230;           /* 键盘键底 */
  --c-d-given: #E8EDF5;       /* 题面数字 / 键盘数字 / 亮色焦点环 */
  --c-d-user: #6FD3C7;        /* 用户填写 / 键盘激活底 */
  --c-d-note: #8B93A8;        /* 笔记 / 次要文字 */
  --c-d-conflict: #FF6B6B;    /* 冲突 */
  --c-d-disabled: #828B9B;    /* 键盘禁用态数字 4.63:1 */
  --c-s-select: #FFC53D;      /* 选中描边 2px / 新纪录 */
  --c-s-same: #4E9A90;        /* 相同数字描边 1px + 4px 圆点 */
  --c-peer-empty: #454953;    /* peer·空格   22% 提亮，1.91:1 */
  /* ⚠️ peer·有内容 8% —— 上限由 note 4.5:1 决定，勿上调。
     9% 即跌至 4.42:1 不达标。8% 的作用是"保住笔记可读"的安全底色，
     并非为了让有内容的格子"看起来被高亮"。见 §8.2 修正 5。 */
  --c-peer-occupied: #282C36;
  --c-line-box: #8593B0;      /* 宫分隔线 2px，5.57:1 */
  --c-line-minor: #6B7996;    /* 格位细线 1px，3.94:1 vs 格位底 / 3.19:1 vs peer 8% 档。
                                  22% 档（2.06:1）**显式豁免**，数学上无解：在 #454953 上
                                  达 3:1 需亮度 ≥0.29964，而 2px 宫线 #8593B0 自身仅 0.28989，
                                  任何达标的线色都比宫线更亮，会把「宫线重于细线」的层级倒挂。
                                  22% 档只出现在「空格 + 无笔记」格（格内无内容），此时边界由
                                  peer 填充与格位的 1.91:1 亮度差承载，不由这 1px 线承载。
                                  备案见 tools/palette-doc-reconcile.js 的 WAIVERS。 */

  /* ===== 字体（仅系统字体，零外链） ===== */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Segoe UI Variable",
    Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
  --weight-regular: 400;  --weight-medium: 500;
  --weight-semibold: 600; --weight-bold: 700;
  --font-size-sm: 13px;   --font-size-base: 15px;   --font-size-md: 17px;   --font-size-lg: 20px;
  --line-height-tight: 1.15; --line-height-normal: 1.5;

  /* ===== 间距（8px 基准，4 的倍数） ===== */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-8: 40px; --space-10: 48px;

  /* ===== 圆角与边框 ===== */
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-full: 9999px;

  /* ===== 棋盘尺寸（UX §1.2 公式，2026-10 手机适配改造）=====
     ⚠️ 易错点 9：棋盘尺寸**完全交给 CSS**，JS 不缓存像素值。
     屏幕旋转后 min()/clamp() 会自动重算，不会溢出。

     ⚠️ 改造要点：--cell 从「只按宽度算」改成「宽度与高度两个约束取小」。
     只按宽度算时，竖屏下棋盘会按 465px 屏宽撑到 ~49px/格，
     把键盘挤出视口 —— 这正是"棋盘偏小/需要滚动"的根因。

     三个输入：
     - --avail-w：棋盘可用宽度（扣左右内边距与刘海安全区）；
     - --hud-h  ：除棋盘之外的**全部竖向固定开销**。它由键盘两档高度
                  （--key-min / --mode-h）**代数推导**，不是拍脑袋的常数。
                  逐项（游玩状态下菜单是 hidden，.app 只有 #game 一个可见子项，
                  所以 .app 自己的 gap 不参与）：
                    .app 上下 padding            8 + 8 = 16
                    头部 .app__header                 48
                    #game 的 gap（头部↔主体）          8
                    .app__body 的 gap（盘面列↔键盘）   12
                    盘面列内 gap（棋盘↔状态条）       12
                    状态条 .app__status                24
                    键盘区内 gap（模式条↔数字键盘）     8
                    数字键盘两行之间 gap（8×2）        16
                    键盘区 padding-bottom              8
                  → 固定部分合计 152px；再加键盘自身的 mode-h + 3×key-min
                  与 16px 安全余量 → 常量取 168px。
                  改键盘两档 clamp 时**无需**改这里（自动跟），
                  改任何固定间距（padding / gap / 状态条高）才需要同步 152。
     - 下限 24px 来自 UX §0 的 T2 分级（格位 ≥24px）：特意从 30px 下调到 24px，
       让极矮视口（横屏 / 分屏 / 小窗）宁可格子小一点也**不裁切、不出滚动条**。 */
  --gutter: 8px;              /* 移动端 8px，桌面端 16px */
  --board-max: 560px;         /* 上限：禁止继续放大 */
  /* 竖屏默认（键盘在盘面下方）：见上方推导 */
  --hud-h: calc(168px + var(--mode-h) + 3 * var(--key-min));
  --avail-w: calc(100vw - 2 * var(--gutter)
                  - env(safe-area-inset-left) - env(safe-area-inset-right));
  /* 先写 vh 版兜底，再用 dvh 版覆盖：不支持 dvh 的旧 WebView 会整条丢弃
     第二条声明、回落到 vh —— 这正是 HANDOVER 5.15 要求的渐进写法。 */
  --cell: clamp(24px, min(calc((var(--avail-w) - 10px) / 9),
                          calc((100vh  - var(--hud-h) - 10px) / 9)), 62px);
  --cell: clamp(24px, min(calc((var(--avail-w) - 10px) / 9),
                          calc((100dvh - var(--hud-h) - 10px) / 9)), 62px);
  /* 字号下限从 18px 下调到 16px：格位下限从 30px 降到 24px 后，
     18px 字会占到小格的 75%，视觉上「顶格」；16px 仍远高于
     --font-size-sm 的 13px，不影响可读性分级。 */
  --digit: clamp(16px, calc(var(--cell) * 0.55), 34px);
  --pencil: calc(var(--digit) * 0.40);

  /* ===== 触摸目标（UX §0 发现 1 分级）=====
     T1 控件严格 44px；T2 格位 ≥24px（9×44=396px 超出 iPhone 14 的
     393px，这是数学事实，不要试图让格位到 44px）；T3 窄屏外扩热区。 */
  --tappable: 44px;
  --cell-hit-slop: 4px;
  /* 键盘两档高度：**下限永远是 T1 的 44px**（无障碍硬约束，不得下调），
     上限由 dvh 派生 —— 竖屏富余高度优先喂给键盘：键更高更好按，
     同时键盘区不再退化成「细窄一条 + 两侧大片留白」。 */
  --key-min: clamp(44px, 7vh, 66px);
  --key-min: clamp(44px, 7dvh, 66px);
  --mode-h: clamp(44px, 5.6vh, 48px);
  --mode-h: clamp(44px, 5.6dvh, 48px);

  /* ===== 动效（极简） ===== */
  --dur-drop: 120ms;   --dur-erase: 100ms;   --dur-select: 80ms;
  --dur-highlight: 120ms; --dur-press: 0ms;   --dur-release: 140ms;
  --ease-out: cubic-bezier(0, 0, 0.2, 1);
  --ease-emphasis: cubic-bezier(0.2, 0, 1, 1);
}

/* ===== 焦点环：按表面亮度自动选色 =====
   规则：暗表面用亮环，实心/亮表面用暗环。**不要按元素类型判断。** */
:focus-visible {
  outline: 2px solid var(--c-d-given);   /* 暗底：亮环 13.52-15.54:1 */
  outline-offset: 2px;
  box-shadow: 0 0 0 2px var(--c-bg);    /* 深色内间隙 */
}
:focus:not(:focus-visible) { outline: none; }

/* 实心表面（青/琥珀填充）必须反转：亮环在此仅 1.34-1.51:1 */
.key--active:focus-visible,
.mode-btn--active:focus-visible,
.difficulty--active:focus-visible,
.btn--primary:focus-visible {
  outline-color: var(--c-bg);            /* 暗环 10.28-11.57:1 */
  box-shadow: 0 0 0 2px var(--c-d-given);
}

/* ===== 基础 ===== */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

/* HANDOVER 5.15 坑 2：`html` 必须自己铺一层纯色底。
   WebView 在页面绘制完成前、以及任何"文档比视口矮"的瞬间，露出的都是
   这层底；不铺就是白条。⭐ 切记不要用 background-attachment 的 fixed 值
   （那个属性在 WebView 里会让背景不随文档铺开，正是坑 2 本身）。 */
html {
  background-color: var(--c-bg);
}

body {
  background: var(--c-bg);
  color: var(--c-d-given);
  font-family: var(--font-sans);
  font-size: var(--font-size-base);
  line-height: var(--line-height-normal);
  -webkit-text-size-adjust: 100%;
  /* R-5 禁用双击缩放（避免坐标偏移导致误触）*/
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  /* ⚠️ 易错点 8：禁止用 100vh 定位底部键盘。
     iOS Safari 的 vh 不含地址栏区域，375px 竖屏下键盘会被推出视口。
     用 flex 布局 + dvh 让键盘始终在视口内。

     ⚠️ 手机适配改造：`min-height` 只作为**兜底下限**，整页高度真正由
     `height: 100dvh` 钉死（`dvh` 跟随 WebView 可视高度，比 vh 稳）。
     内容若因异常字体/超大安全区仍然超高，会由 body 自己滚动 —— 这是
     "宁可滚一点也不要裁掉"的最后退路。 */
  min-height: 100vh;
  min-height: 100dvh;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;         /* 四个宽度下均不得出现横向滚动 */
  overflow-y: auto;           /* 仅在极端情况下才会真滚动（见上） */
}

[hidden] { display: none !important; }

/* ===== 应用外框：flex 列，头部 / 盘面 / 键盘三段 ===== */

.app {
  /* `flex: 1 0 auto`：空闲时用 flex-grow 撑满视口（键盘才能被 margin-top:auto
     推到底部）；内容一旦高于视口就**不收缩**（flex-shrink 0），让内容按
     真实高度溢出、由 body 的 overflow-y 滚动 —— 收缩反而会让子项互相压叠。 */
  flex: 1 0 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;              /* 关键：允许子项在 flex 中收缩，避免溢出 */
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  /* 左右内边距带上刘海安全区；与 --avail-w 的扣减口径保持一致，
     否则「算宽度时扣了、实际没扣」会让棋盘横向溢出一条缝。 */
  padding-top: var(--space-2);
  padding-bottom: var(--space-2);
  padding-left: calc(var(--gutter) + env(safe-area-inset-left));
  padding-right: calc(var(--gutter) + env(safe-area-inset-right));
  gap: var(--space-2);
  /* ⚠️ 这里刻意**不用** overflow-x: hidden：
     CSS 规定「一个轴非 visible 时另一轴的计算值会从 visible 变成 auto」，
     给 .app 任一方向设 hidden 都会把 .app 变成滚动容器、抢走 body 的滚动职责。
     横向溢出由 body 的 overflow-x: hidden 兜，纵向由 body 的 overflow-y: auto 兜。 */
  min-width: 0;
}

/* ===== 游戏界面外框 =====
   ⚠️ 新增（原文件没有 #game 的任何样式）：让 #game 成为 flex 列，
   使 `.app__body` 能吃掉视口剩余高度 —— 这样「棋盘靠上、键盘贴底」
   才能成立；不加这条，#game 是普通 block，剩余高度会全部堆在最底下、
   键盘被顶到视口底部之外。
   只加样式、不动 DOM，JS 仅通过 hidden 属性开关它，互不影响。 */
#game {
  display: flex;
  flex-direction: column;
  /* 同样 `flex: 1 0 auto`：能吃剩余高度，但内容超高时**不压缩**，
     宁可让 body 出滚动条，也不要子项互相压叠（压叠会直接遮住键盘）。 */
  flex: 1 0 auto;
  min-height: 0;
  gap: var(--space-2);
}

/* ===== 头部 ===== */

.app__header {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 48px;
}

.app__title {
  margin: 0;
  font-size: var(--font-size-md);
  font-weight: var(--weight-semibold);
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.app__timer {
  font-size: var(--font-size-md);
  font-weight: var(--weight-semibold);
  font-variant-numeric: tabular-nums;   /* 等宽数字，读秒不跳动 */
  color: var(--c-d-given);
  flex: 0 0 auto;
}
body.no-timer .app__timer { display: none; }

/* ===== 主体 ===== */

.app__body {
  /* 同上：吃剩余高度但**不压缩**，避免超高时棋盘与键盘互相压叠。 */
  flex: 1 0 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  /* ⚠️ HANDOVER 5.15 坑 3：**不能用 justify-content: center**。
     内容一旦比视口高（横屏 / 分屏 / 小窗），居中会把溢出**对半分到上下**，
     上半部分 top 变负 → 棋盘跑到屏幕外且滚不到。
     改成 flex-start + 键盘区 margin-top:auto：内容装得下时键盘贴底，
     装不下时从顶部开始、溢出的部分落在下方（可滚），永远不会出现负 top。 */
  justify-content: flex-start;
  gap: var(--space-3);
  width: 100%;
}

/* 棋盘列（盘面 + 状态条）：原文件只在桌面媒体查询里定义，这里补基础规则，
   让移动端也能享受「状态条与盘面同宽、居中对齐」的统一约束。 */
.board-col {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
  max-width: 100%;
  min-width: 0;
}

/* ===== 棋盘 ===== */

.board {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  /* 宽度三约束取小：格宽×9 + 边框 / 可用宽度 / 硬上限。
     用 --avail-w（已扣安全区）替代原来的 100vw 口径。 */
  width: min(calc(var(--cell) * 9 + 10px), var(--avail-w), var(--board-max));
  background: var(--c-cell);
  border: 5px solid var(--c-line-box);
  border-radius: var(--radius-md);
  overflow: hidden;
  /* ⚠️ 不要给 81 个格子各加 border —— 那会产生 81 个绘制层。
     格线改由 .cell 的 box-shadow: inset 绘制。 */
  touch-action: manipulation;
}

.cell {
  position: relative;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--digit);
  color: var(--c-d-given);
  font-variant-numeric: tabular-nums;
  line-height: var(--line-height-tight);
  cursor: pointer;
  /* 格位细线：1px #6B7996，画在格内边缘（inset，不占布局）
     注意：inset 意味着这 1px 落在格位**边缘像素带**上，而笔记文字画在格**内部** ——
     两者像素不相交，故「线色提亮」与「笔记文字对比度」是两组独立约束。 */
  box-shadow: inset -1px -1px 0 0 var(--c-line-minor);
  transition: background-color var(--dur-highlight) var(--ease-out);
}

/* 宫分隔线 5px：仅用明度/粗细区分，绝不用色相（§7.5 反模式警示）
   boxline-r 标记在宫之间（c=2,5），粗线画在该格右侧。
   boxline-b 标记在宫之间（r=2,5），粗线画在该格底侧。 */
.cell[data-boxline-r] {
  box-shadow: inset -5px 0 0 0 var(--c-line-box),     /* 宫线：右侧 */
              inset 0 -1px 0 0 var(--c-line-minor);   /* 细线：底侧 */
}
.cell[data-boxline-b] {
  box-shadow: inset -1px 0 0 0 var(--c-line-minor),   /* 细线：右侧 */
              inset 0 -5px 0 0 var(--c-line-box);     /* 宫线：底侧 */
}
.cell[data-boxline-r][data-boxline-b] {
  box-shadow: inset -5px 0 0 0 var(--c-line-box),     /* 宫线：右侧 */
              inset 0 -5px 0 0 var(--c-line-box);     /* 宫线：底侧 */
}

/* T3 窄屏命中区补偿：外扩 4px，不越中心线（UX §1.3） */
.cell::after {
  content: "";
  position: absolute;
  inset: calc(var(--cell-hit-slop) * -1);
  pointer-events: none;
}

/* peer：填充通道，两级强度。
   ⚠️ 易错点 7：这是 peer 唯一的表达通道，**不得**改成描边。
   ⚠️ D-NOTE-01：空格若含笔记必须走 8% 安全档 —— note 在 22% 上仅 2.93:1（AA 要求 4.5）。

   失败安全的关键是**用正向标记**data-note-free，而不是 :not([data-has-notes])：
   :not([data-has-notes]) 在属性「缺失」时同样命中，会让疏漏的格子落到 22% 危险档，
   方向正好相反。改为只有 JS 明确标记「确实无笔记」时才给22%，
   任何未标记/漏标的情况都落8% —— worst case 是"高亮变弱"，不是"笔记看不见"。 */
.cell[data-peer="empty"] { background: var(--c-peer-occupied); }            /* 缺省：8% 安全档 */
.cell[data-peer="empty"][data-note-free] { background: var(--c-peer-empty); } /* 确认无笔记：22% */
.cell[data-peer="occupied"] { background: var(--c-peer-occupied); }

/* 内容状态：given 不再另设底色，靠字重区分 */
.cell[data-state="given"] { font-weight: var(--weight-semibold); }
.cell[data-state="user"]  { color: var(--c-d-user); font-weight: var(--weight-regular); }
.cell[data-state="empty"] { font-weight: var(--weight-regular); }

/* conflict：字重 700 + 2px 底部波浪线（非颜色通道，WCAG 1.4.1） */
.cell[data-state="conflict"] {
  color: var(--c-d-conflict);
  font-weight: var(--weight-bold);
  background: var(--c-peer-occupied);
  box-shadow: inset -1px -1px 0 0 var(--c-line-minor), inset 0 -2px 0 0 var(--c-d-conflict);
}

/* same-digit：1px 描边 + 左上 4px 实心圆点
   ⚠️ 易错点 6：这个圆点是**承重结构**。peer 与 same-digit 的描边分离度
   正常视觉下仅 1.57:1、红色盲 1.43:1，圆点是唯一区分通道，不得省略。 */
.cell[data-state="same"] {
  box-shadow: inset 0 0 0 1px var(--c-s-same), inset -1px -1px 0 0 var(--c-line-minor);
}
.cell[data-state="same"]::before {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--c-s-same);
  /* 圆点必须压在 peer 填充之上，故给 z-index */
  z-index: 2;
}

/* selected：2px 描边，全图唯一最粗，永远最上 */
.cell[data-state="selected"] {
  box-shadow: inset 0 0 0 2px var(--c-s-select);
  z-index: 3;
}

/* 笔记：40% 字号 + 3×3 迷你栅格 */
.cell span {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  width: 100%;
  height: 100%;
  place-items: center;
  font-size: var(--pencil);
  color: var(--c-d-note);
  line-height: 1;
  font-weight: var(--weight-regular);
}
.cell[data-state="user"] span,
.cell[data-state="given"] span { display: block; font-size: var(--digit); color: inherit; }

/* ===== 状态条 ===== */

.app__status {
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-3);
  /* 与棋盘同宽（三约束同口径），否则左侧文字会对不齐棋盘边缘 */
  width: min(calc(var(--cell) * 9 + 10px), var(--avail-w), var(--board-max));
  min-height: 24px;
  max-width: 100%;
  font-size: var(--font-size-sm);
  color: var(--c-d-note);
  font-variant-numeric: tabular-nums;
}

/* ===== 键盘区（常驻底部）===== */

.keypad-wrap {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  /* ⚠️ 手机适配关键：原文件此处**没有宽度**，而父级是 align-items:center，
     于是键盘退化成一条按内容收缩的窄条（≈150px，两侧大片留白）——
     这正是用户反馈的"键盘与棋盘不搭、留白浪费"。
     这里让它与棋盘**同宽**（同一个三约束表达式），键盘立即撑满。 */
  width: min(calc(var(--cell) * 9 + 10px), var(--avail-w), var(--board-max));
  max-width: 100%;
  padding-bottom: var(--space-2);
  /* 软键盘/地址栏收缩不遮挡棋盘区 */
  padding-bottom: max(var(--space-2), env(safe-area-inset-bottom));
  /* 富余高度优先分给「棋盘 → 键盘」之间的空白，而不是堆到页面底部；
     溢出时 auto 外边距自动归零，不会出现负 top（HANDOVER 5.15 坑 3）。 */
  margin-top: auto;
}

/* 模式条：三态常驻可见，不可折叠收起 */
.mode-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-2);
}

.mode-btn {
  min-height: var(--mode-h);         /* 下限 44px（T1），上限由 dvh 派生 */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: var(--c-key);
  color: var(--c-d-given);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-family: inherit;
  cursor: pointer;
  /* 零延迟原则：按下态不挂 transition */
}
.mode-btn:active { transition: none; }
.mode-btn__symbol { font-size: var(--font-size-md); line-height: 1; }
.mode-btn__label { font-size: var(--font-size-sm); color: var(--c-d-note); line-height: 1; }
.mode-btn--active { background: var(--c-s-select); color: var(--c-bg); border-color: var(--c-s-select); }
.mode-btn--active .mode-btn__label { color: var(--c-bg); }

/* 数字键盘 3×3 */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-2);
}

.key {
  position: relative;
  min-height: var(--key-min);       /* T1 严格 44px */
  /* 防细长：键盘行高由 grid-auto-rows / min-height 决定，禁止再被外层压缩
     （与 .btn 的 flex:0 0 auto 同一条防御口径）。 */
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: var(--c-key);
  color: var(--c-d-given);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-weight: var(--weight-semibold);
  cursor: pointer;
  overflow: hidden;
  transition: background-color var(--dur-release) var(--ease-out);
}
.key:active { transition: none; }   /* 按下 0ms */
.key__digit { font-size: var(--font-size-lg); line-height: 1; }
.key__count { font-size: var(--font-size-sm); color: var(--c-d-note); line-height: 1; font-variant-numeric: tabular-nums; }

/* 笔记模式下已记候选的数字键 */
.key--noted { background: var(--c-peer-empty); }
.key--noted .key__count { color: var(--c-d-user); }

/* 禁用态：数字保持 4.63:1 可读，"已用尽"由三通道承载
   —— (0) 徽标 + 斜线纹理 + disabled 属性。不能只靠低对比度。 */
.key:disabled {
  color: var(--c-d-disabled);
  cursor: default;
}
.key--exhausted::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(45deg,
    transparent 0 5px, rgba(130, 139, 155, 0.14) 5px 6px);
  border-radius: var(--radius-sm);
  pointer-events: none;
}

/* ===== 菜单 ===== */

.menu {
  /* ⚠️ 与 .app__body 同一个理由（HANDOVER 5.15 坑 3）：不用 justify-content:center。
     `flex: 0 0 auto` + `margin-block: auto`：内容矮时上下自动外边距把菜单
     视觉居中；内容一旦比视口高（横屏 / 大字号），auto 外边距归零、从顶部
     开始排，溢出落在下方由 body 滚动兜住 —— 永远不出现负 top。 */
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  margin-block: auto;
  gap: var(--space-4);
  max-width: 480px;
  margin-left: auto;
  margin-right: auto;
  padding: var(--space-4) 0 calc(var(--space-4) + env(safe-area-inset-bottom));
  width: 100%;
}

.menu__title {
  margin: 0;
  font-size: var(--font-size-lg);
  font-weight: var(--weight-semibold);
  text-align: center;
}

.menu__list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-2);
}

.difficulty {
  min-height: 56px;                 /* T1 ≥44px，难度项高 56 */
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--c-cell);
  color: var(--c-d-given);
  border: 1px solid var(--c-line-minor);
  border-radius: var(--radius-md);
  font-family: inherit;
  font-size: var(--font-size-base);
  cursor: pointer;
}
.difficulty--active {
  background: var(--c-s-select);
  color: var(--c-bg);
  border-color: var(--c-s-select);
  font-weight: var(--weight-semibold);
}

.menu__actions {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.btn {
  min-height: var(--tappable);       /* T1 严格 44px，弹窗按钮同样 */
  /* 防细长：在 flex 列容器（.menu__actions / .panel__actions）里禁止被压缩。
     某些 WebView/字体缩放组合下 flex-shrink 默认值会把按钮压成一行文字高，
     显式钉死"不参与伸缩、高度由内容+min-height 决定"。 */
  flex: 0 0 auto;
  height: auto;
  padding: 0 var(--space-4);
  background: var(--c-key);
  color: var(--c-d-given);
  border: 1px solid var(--c-line-minor);
  border-radius: var(--radius-md);
  font-family: inherit;
  font-size: var(--font-size-base);
  cursor: pointer;
}
.btn--primary {
  background: var(--c-d-user);
  color: var(--c-bg);
  border-color: var(--c-d-user);
  font-weight: var(--weight-semibold);
}
.btn:disabled { opacity: 0.6; cursor: default; }
.btn--wide { width: 100%; }

/* ===== 弹层 ===== */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  /* 安全区：横屏时左右刘海不能压住面板内容 */
  padding: calc(var(--space-4) + env(safe-area-inset-top))
           calc(var(--space-4) + env(safe-area-inset-right))
           calc(var(--space-4) + env(safe-area-inset-bottom))
           calc(var(--space-4) + env(safe-area-inset-left));
  background: rgba(18, 21, 28, 0.92);
}

.panel {
  width: min(100%, 420px);
  /* 面板自身内部滚动（overlay 是 fixed，所以这里的居中 + 内部滚动是安全的，
     不会出现 HANDOVER 5.15 坑 3 那种「负 top」）。
     dvh 版在后、vh 版在前，同样是渐进覆盖。 */
  max-height: 85vh;
  max-height: 85dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--c-cell);
  border: 1px solid var(--c-line-minor);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  animation: panel-in 200ms var(--ease-emphasis);
}

@keyframes panel-in {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.panel__title {
  margin: 0;
  font-size: var(--font-size-md);
  font-weight: var(--weight-semibold);
  text-align: center;
}
.panel__actions { display: flex; flex-direction: column; gap: var(--space-2); }
.panel__empty { color: var(--c-d-note); text-align: center; padding: var(--space-5) 0; }

/* 完成面板 */
.complete__time {
  margin: 0;
  font-size: 40px;
  font-weight: var(--weight-semibold);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
/* 新纪录用琥珀色，与选中色同源，不引入新色相（守住 13 色预算） */
.complete__record {
  margin: 0;
  text-align: center;
  color: var(--c-s-select);
  font-weight: var(--weight-semibold);
}
.complete__meta { margin: 0; display: flex; flex-direction: column; gap: var(--space-1); }
.complete__meta > div { display: flex; justify-content: space-between; gap: var(--space-3); }
.complete__meta dt { color: var(--c-d-note); margin: 0; }
.complete__meta dd { margin: 0; font-variant-numeric: tabular-nums; }

/* 暂停面板的校验结果 */
#pause-stats {
  color: var(--c-d-note);
  text-align: center;
  min-height: 1.5em;
  font-variant-numeric: tabular-nums;
}

/* ===== 设置 ===== */
.setting__hint {
  margin: 0 0 var(--space-3);
  color: var(--c-d-note);
  font-size: var(--font-size-sm);
  line-height: 1.5;
}

.settings { display: flex; flex-direction: column; gap: var(--space-3); }
.setting {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  min-height: var(--tappable);       /* T1：点击区 ≥44px */
}
.setting__label { flex: 1 1 auto; }
.setting__toggle {
  width: 48px;
  height: 28px;
  flex: 0 0 auto;
  accent-color: var(--c-d-user);
  cursor: pointer;
}

/* ===== 统计面板 ===== */

.stats { display: flex; flex-direction: column; gap: var(--space-3); }
.stats-totals { display: flex; flex-wrap: wrap; gap: var(--space-3); justify-content: space-around; }
.stats-totals__item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.stats-totals__num { font-size: var(--font-size-lg); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
.stats-totals__label { font-size: var(--font-size-sm); color: var(--c-d-note); }
.stats-record { margin: 0; color: var(--c-d-note); font-size: var(--font-size-sm); text-align: center; }

.stats-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.stats-table th, .stats-table td { padding: var(--space-2) var(--space-1); text-align: right; }
.stats-table thead th { color: var(--c-d-note); font-weight: var(--weight-medium); font-size: var(--font-size-sm); }
.stats-table tbody th { text-align: left; font-weight: var(--weight-medium); }
.stats-table tbody tr + tr th, .stats-table tbody tr + tr td { border-top: 1px solid var(--c-line-minor); }

/* ===== Loading / Toast ===== */

.loading {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  background: rgba(18, 21, 28, 0.9);
}
.loading__spinner {
  width: 32px;
  height: 32px;
  border: 2px solid var(--c-line-minor);
  border-top-color: var(--c-d-user);
  border-radius: 50%;
  animation: spin 900ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading__text { color: var(--c-d-note); font-size: var(--font-size-base); }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--space-8) + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 300;
  max-width: min(90vw, 420px);
  padding: var(--space-3) var(--space-4);
  background: var(--c-key);
  color: var(--c-d-given);
  border: 1px solid var(--c-line-minor);
  border-radius: var(--radius-md);
  font-size: var(--font-size-sm);
  text-align: center;
}

/* ===== 响应式 ===== */

/* 桌面 / 平板：盘面在左、键盘在右侧栏（§7.2），纵向约束不再是键盘而是头部。
   ⚠️ 本轮需求 7：「将键盘与棋盘上下摆放，更符合手机屏幕」——
   断点从 768px 收窄到 1024px：768~1023px 的小平板竖屏宽度足够放下
   "棋盘 + 280px 键盘侧栏"但两侧会大片留白，上下摆放（棋盘居中 + 键盘同宽贴底）
   在竖屏上的可读性与可达性都更好。手机（含大屏手机）从此**永远**上下摆放。 */
@media (min-width: 1024px) {
  :root {
    --gutter: 16px;
    /* 桌面端布局（.app__body 是 row）：除棋盘外的竖向开销
       = 上下 padding 24 + 头部 48 + #game gap 8 + 状态条 24
         + board-col gap 12 = 116px，再加 12px 安全余量 = 128px */
    --hud-h: 128px;
    /* 棋盘宽度还必须让出右侧键盘侧栏（320px）、两者之间的 32px 间距
       与 4px 取整余量，否则恰好 1024px 的窄桌面（含平板横屏）会横向溢出。 */
    --avail-w: calc(100vw - 2 * var(--gutter)
                    - env(safe-area-inset-left) - env(safe-area-inset-right)
                    - 320px - var(--space-6) - 4px);
  }
  .app {
    padding-top: var(--space-3);
    padding-bottom: var(--space-3);
    padding-left: calc(var(--gutter) + env(safe-area-inset-left));
    padding-right: calc(var(--gutter) + env(safe-area-inset-right));
    gap: var(--space-3);
  }
  .app__body {
    flex-direction: row;
    align-items: flex-start;
    justify-content: center;
    gap: var(--space-6);
    /* row 布局下横向居中即可；不要续用移动端的 flex-start（会靠左留白） */
  }
  /* 桌面端数字面板在侧栏，不在盘面正下方（§7.2）。
      ⚠️ 必须显式覆写 width，否则继承移动端的「与棋盘同宽」表达式。 */
  .keypad-wrap {
    width: 320px;
    max-width: 320px;
    margin-top: 0;
    padding-bottom: 0;
  }
  .keypad-wrap .keypad { grid-template-columns: repeat(3, 1fr); }
}

/* 横屏 / 矮视口（BP-4）：盘面置左 + 键盘置右
   ⚠️ 条件里**去掉了 max-width: 768px**（原写法）：手机横屏后 CSS 宽度会变成
   900 左右，`max-width:768px` 会把手机横屏整个排除在外，落回桌面三段布局，
   棋盘只剩 ~270px 而左右空一大片。改成按「宽 + 矮」判定，
   平板横屏 / 小窗也走这一支，行为一致。

   ⚠️ **不能用 `orientation: landscape`**（v1.1.78 实测修复）：Android WebView 里
   这个媒体特性按**设备屏幕方向**而非视口宽高比求值，竖屏手机（视口 385×746）
   也会被判成 landscape，于是整页走「盘面左 / 键盘右」的宽屏布局，
   下方留一大片空白、字也变小。改用纯尺寸判定（宽 ≥ 600 且高 ≤ 560），
   竖屏 385×746 两个条件都不满足，稳定走竖屏分支。 */
@media (min-width: 600px) and (max-height: 560px) {
  :root {
    /* 横屏是左右布局，除棋盘外的竖向开销：手机横屏（宽 <1024px，本轮起
       桌面段断点也是 1024）时 = 上下 padding 16 + 头部 48 + #game gap 8
       + 状态条 24 + board-col gap 12 = 108px；宽 ≥1024px 的平板横屏会同时
       命中桌面段（padding 12+12）= 116px。取两者较大值 116 再加 8px 余量 = 124px。 */
    --hud-h: 124px;
    /* 键盘列宽度先定，棋盘宽度再让：两者相加永远不超过视口宽度
       （不留「按 48vw 扣、实际却渲染成 min(46vw,340px)」那种口径差）。 */
    --kp-w: min(46vw, 340px);
    --avail-w: calc(100vw - 2 * var(--gutter)
                    - env(safe-area-inset-left) - env(safe-area-inset-right)
                    - var(--kp-w) - var(--space-3) - 4px);
  }
  .app__body {
    flex-direction: row;
    align-items: flex-start;
    /* 横屏下盘面高度受限、宽度有富余，居中让「盘面 + 键盘」整体不留单侧空档 */
    justify-content: center;
    gap: var(--space-3);
    /* 与基础规则同口径：能长、不缩（超高交给 body 滚动，不压叠） */
    flex: 1 0 auto;
    min-height: 0;
  }
  /* 键盘列：3 列 × 3 行。键宽 ≈(340-16)/3 ≈ 108px，远超 T1 的 44px；
     比原来的「9 列横排」（键宽只有 ~40px）好按得多。 */
  .keypad-wrap {
    width: var(--kp-w);
    max-width: var(--kp-w);
    margin-top: 0;
    align-self: stretch;
    justify-content: flex-start;
  }
  .keypad { grid-template-columns: repeat(3, 1fr); }
  .mode-bar { grid-template-columns: repeat(3, 1fr); }
  /* 横屏的富余高度全部喂给键盘：3 行键按 1fr 均分剩余高度

/* ===== 减弱动效 =====

@media (prefers-reduced-motion: reduce) {

    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;

  }
}

<script>
/* 数独 · 内联打包产物（由 tools/build-ui.mjs 生成，请勿手改）
 * 源文件：src/engine/*.js + src/ui/*.js
 * 重新生成：node tools/build-ui.mjs
 */
(function () {
'use strict';

// ══════════════ 模块注册表 ══════════════
// 每个模块包在自己的 IIFE 里，私有符号天然隔离。
// 这解决了 parseBoardString 在 solver 与 difficulty 中同名的问题——
// 直接拼接会因 const 重复声明而 SyntaxError。
var __registry = {};
var __cache = {};
function __def(id, fn) { __registry[id] = fn; }
function __req(id) {
  if (__cache[id]) return __cache[id];
  var fn = __registry[id];
  if (!fn) throw new Error('模块未注册: ' + id);
  var exports = fn(__req);

  return exports;
}

__def("sudoku-core.js", function (__req) {
 
                                 
  
        
                          
                                                               
                                                                
                                                            
                                    
  
                      
   

       
const SIZE = 9;
        
const CELLS = SIZE * SIZE;      
        
const BOX_SIZE = 3;
                                
const UNIT_COUNT = 27;
         
const EMPTY = 0;

          
const CELL_EMPTY = 0;
                  
const CELL_GIVEN = 1;
            
const CELL_USER = 2;

           
const UNIT_ROW = 0;
           
const UNIT_COL = 1;
           
const UNIT_BOX = 2;

                      
const ALL_CANDIDATES = 0x1ff;

                                                                     
                       
                                                                        

                                        
const PEER_COUNT = 20;
                                                 
const PEER_TOTAL = PEER_COUNT;

                                                           
const PEER_TABLE =               (() => {
  const table = new Int16Array(CELLS * PEER_TOTAL);
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const i = r * SIZE + c;
      const list = [];
               
      for (let k = 0; k < SIZE; k++) if (k !== c) list.push(r * SIZE + k);
               
      for (let k = 0; k < SIZE; k++) if (k !== r) list.push(k * SIZE + c);
                                                   
      const br = r - (r % BOX_SIZE);
      const bc = c - (c % BOX_SIZE);
      for (let dr = 0; dr < BOX_SIZE; dr++) {
        for (let dc = 0; dc < BOX_SIZE; dc++) {
          const rr = br + dr;
          const cc = bc + dc;
          if (rr === r || cc === c) continue;             
          list.push(rr * SIZE + cc);
        }
      }
      table.set(list, i * PEER_TOTAL);
    }
  }
  return table;
})();

                                         
const PEERS = PEER_TABLE;

                                                
const UNIT_TABLE =               (() => {
  const table = new Int16Array(UNIT_COUNT * SIZE);
                         
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) table[r * SIZE + c] = r * SIZE + c;
  }
                             
  for (let c = 0; c < SIZE; c++) {
    for (let r = 0; r < SIZE; r++) table[(SIZE + c) * SIZE + r] = r * SIZE + c;
  }
                      
  for (let br = 0; br < SIZE; br += BOX_SIZE) {
    for (let bc = 0; bc < SIZE; bc += BOX_SIZE) {
      const u = 18 + (br / BOX_SIZE) * BOX_SIZE + bc / BOX_SIZE;
      let n = 0;
      for (let dr = 0; dr < BOX_SIZE; dr++) {
        for (let dc = 0; dc < BOX_SIZE; dc++) {
          table[u * SIZE + n++] = (br + dr) * SIZE + (bc + dc);
        }
      }
    }
  }
  return table;
})();

                           
const UNITS = UNIT_TABLE;

                      
const POPCOUNT =               (() => {
  const t = new Uint8Array(512);
  for (let m = 0; m < 512; m++) t[m] = (m & 1) + t[m >> 1];
  return t;
})();

                                                                     
       
                                                                        

            
function rowOf(index) {
  return (index / SIZE) | 0;
}
            
function colOf(index) {
  return index % SIZE;
}
                       
function boxOf(index) {
  return (((index / SIZE) | 0) / BOX_SIZE | 0) * BOX_SIZE + ((index % SIZE) / BOX_SIZE | 0);
}
           
function indexOf(row, col) {
  return row * SIZE + col;
}

                                                                     
       
                                                                        

                   
function bitCount(mask) {
  return POPCOUNT[mask & 0x1ff];
}

                                      
function singleDigit(mask) {
  const m = mask & 0x1ff;
  if (m === 0 || (m & (m - 1)) !== 0) return 0;
  for (let d = 1; d <= SIZE; d++) if (m & (1 << (d - 1))) return d;
  return 0;
}

                      
function maskToDigits(mask) {
  const out = [];
  const m = mask & 0x1ff;
  for (let d = 1; d <= SIZE; d++) if (m & (1 << (d - 1))) out.push(d);
  return out;
}

                  
function digitsToMask(digits) {
  let m = 0;
  for (const d of digits) m |= 1 << (d - 1);
  return m & 0x1ff;
}

const now =
  typeof globalThis.performance?.now === 'function'
    ? () => globalThis.performance.now()
    : () => Date.now();

                 
const nowMs = now;

                                                                     
           
                                                                        

          
function createEmptyBoard() {
  return new Uint8Array(CELLS);
}

         
function cloneBoard(board) {
  /* ⚠️ 2026-10-22 修复（"继续本局"点了没反应的真凶）：
     原实现是 `Uint8Array.prototype.slice.call(board)`——它要求 `board` 本身是
     TypedArray。但**从 localStorage 存档里读回来的 board 是普通 Array**
     （JSON 没有 TypedArray），continueGame 把 `save.puzzle.givens` 直接传给
     createPuzzleState → cloneBoard → 抛
     `TypeError: Method %TypedArray%.prototype.slice called on incompatible receiver`。
     异常发生在点击回调里，界面上就是"按钮点了完全没反应"（控制台才有红字）。
     这里按来源分两支：TypedArray 走 slice（零拷贝语义保持），
     其它（Array / 类数组）用 `Uint8Array.from` 转换后再克隆。 */
  if (board instanceof Uint8Array) return board.slice();
  return Uint8Array.from(board);
}

 
                
                                           
                      
                        
   
function boardFromString(str) {
  if (typeof str !== 'string') throw new TypeError('boardFromString: 需要 string');
  const cleaned = str.replace(/[\r\n\t ]/g, '');
  if (cleaned.length !== CELLS) {
    throw new RangeError(`boardFromString: 需要 ${CELLS} 个字符，实际 ${cleaned.length}`);
  }
  const board = new Uint8Array(CELLS);
  for (let i = 0; i < CELLS; i++) {
    const ch = cleaned[i];
    if (ch >= '1' && ch <= '9') {
      board[i] = ch.charCodeAt(0) - 48;
    } else if (ch === '0' || ch === '.' || ch === '-' || ch === '_') {
      board[i] = EMPTY;
    } else {
      throw new TypeError(`boardFromString: 非法字符 "${ch}" @${i}`);
    }
  }
  return board;
}

 
              
                            
                                            
                    
   
function boardToString(board, options = {}) {
  const emptyChar = options.emptyChar ?? '.';
  let s = '';
  for (let i = 0; i < CELLS; i++) s += board[i] === EMPTY ? emptyChar : String(board[i]);
  return s;
}

 
                  
                           
                        
   
function boardFromGrid(grid) {
  if (!Array.isArray(grid) || grid.length !== SIZE) throw new TypeError('boardFromGrid: 需要 9 行');
  const board = new Uint8Array(CELLS);
  for (let r = 0; r < SIZE; r++) {
    const row = grid[r];
    if (!row || row.length !== SIZE) throw new TypeError('boardFromGrid: 每行需要 9 列');
    for (let c = 0; c < SIZE; c++) {
      const v = row[c];
      board[r * SIZE + c] = v >= 1 && v <= 9 ? v : EMPTY;
    }
  }
  return board;
}

         
function countFilled(board) {
  let n = 0;
  for (let i = 0; i < CELLS; i++) if (board[i] !== EMPTY) n++;
  return n;
}

        
function countEmpty(board) {
  return CELLS - countFilled(board);
}

                                                                     
        
                                                                        

 
                                        
                            
                             
                            
                     
   
function isValidPlacement(board, index, value) {
  if (index < 0 || index >= CELLS) return false;
  if (value < 1 || value > SIZE) return false;
  const bit = 1 << (value - 1);
  const base = index * PEER_COUNT;
  for (let k = 0; k < PEER_COUNT; k++) {
    if (board[PEER_TABLE[base + k]] === value) return false;
  }
  return true;
}

 
                         
                            
                               
   
function getConflicts(board) {
  const bad = new Uint8Array(CELLS);
  for (let u = 0; u < UNIT_COUNT; u++) {
    for (let d = 1; d <= SIZE; d++) {
      let first = -1;
      let count = 0;
      for (let k = 0; k < SIZE; k++) {
        const i = UNIT_TABLE[u * SIZE + k];
        if (board[i] !== d) continue;
        if (first < 0) first = i;
        count++;
      }
      if (count > 1) {
        bad[first] = 1;
        for (let k = 0; k < SIZE; k++) {
          const i = UNIT_TABLE[u * SIZE + k];
          if (board[i] === d) bad[i] = 1;
        }
      }
    }
  }
  const out = [];
  for (let i = 0; i < CELLS; i++) if (bad[i]) out.push(i);
  return out;
}

 
          
                            
                                                                                
                                                     
   
function validateBoard(board) {
  const conflicts = getConflicts(board);
  const filled = countFilled(board);
  return {
    valid: conflicts.length === 0,
    complete: filled === CELLS && conflicts.length === 0,
    filled,
    empty: CELLS - filled,
    givens: countGivens(board),
    conflicts,
  };
}

                                 
function countGivens(board) {
                                      
  return countFilled(board);
}

                                                                     
        
                                                                        

 
                  
                            
                                                       
                                   
   
function computeCandidates(board, out) {
  const cand = out && out.length === CELLS ? out : new Int16Array(CELLS);
  for (let i = 0; i < CELLS; i++) {
    if (board[i] !== EMPTY) {
      cand[i] = 0;
      continue;
    }
    let mask = ALL_CANDIDATES;
    const base = i * PEER_COUNT;
    for (let k = 0; k < PEER_COUNT; k++) {
      const v = board[PEER_TABLE[base + k]];
      if (v !== EMPTY) mask &= ~(1 << (v - 1));
    }
    cand[i] = mask;
  }
  return cand;
}

 
                
                            
                        
                      
   
function getCandidateDigits(board, index) {
  if (board[index] !== EMPTY) return [];
  let mask = ALL_CANDIDATES;
  const base = index * PEER_COUNT;
  for (let k = 0; k < PEER_COUNT; k++) {
    const v = board[PEER_TABLE[base + k]];
    if (v !== EMPTY) mask &= ~(1 << (v - 1));
  }
  return maskToDigits(mask);
}

 
                
                            
                        
                    
   
function getCandidateMask(board, index) {
  if (board[index] !== EMPTY) return 0;
  let mask = ALL_CANDIDATES;
  const base = index * PEER_COUNT;
  for (let k = 0; k < PEER_COUNT; k++) {
    const v = board[PEER_TABLE[base + k]];
    if (v !== EMPTY) mask &= ~(1 << (v - 1));
  }
  return mask;
}

                                                                     
       
                                                                        

 
                            
                                 
                      
   
function getUnitCells(unitIndex) {
  const out = new Array(SIZE);
  for (let k = 0; k < SIZE; k++) out[k] = UNIT_TABLE[unitIndex * SIZE + k];
  return out;
}

 
                                 
                        
                                      
   
function getCellUnits(index) {
  const r = (index / SIZE) | 0;
  const c = index % SIZE;
  return [r, SIZE + c, 18 + ((r / BOX_SIZE) | 0) * BOX_SIZE + ((c / BOX_SIZE) | 0)];
}

 
                  
                        
                      
   
function getBoxCells(index) {
  return getUnitCells(18 + (((index / SIZE) | 0) / BOX_SIZE | 0) * BOX_SIZE + ((index % SIZE) / BOX_SIZE | 0));
}

                                                                     
                      
  
                                        
                                                    
                                                                        

 
                                
                                             
                                                                          
                                                   
                                              
                                                     
                                          
                               
   

 
          
                                                                                                             
                         
   
function createPuzzleState(params) {
  const givens = typeof params.givens === 'string' ? boardFromString(params.givens) : cloneBoard(params.givens);
  const solution =
    params.solution == null
      ? null
      : typeof params.solution === 'string'
        ? boardFromString(params.solution)
        : cloneBoard(params.solution);

  const values = cloneBoard(givens);
  const status = new Uint8Array(CELLS);
  for (let i = 0; i < CELLS; i++) status[i] = givens[i] !== EMPTY ? CELL_GIVEN : CELL_EMPTY;

  return {
    values,
    status,
    notes: new Int16Array(CELLS),
    givens,
    solution,
    difficulty: params.difficulty ?? null,
    createdAt: now(),
  };
}

                                                   
function cloneState(state) {
  return {
    // 2026-10-22：与 cloneBoard 同一条修复——从存档重建的 state 里，
    // values/status/notes 可能是普通 Array（JSON 无 TypedArray），
    // 直接 `%TypedArray%.prototype.slice.call` 会抛 TypeError。
    values: state.values instanceof Uint8Array ? state.values.slice() : Uint8Array.from(state.values),
    status: state.status instanceof Uint8Array ? state.status.slice() : Uint8Array.from(state.status),
    notes: state.notes instanceof Int16Array ? state.notes.slice() : Int16Array.from(state.notes),
    givens: state.givens,
    solution: state.solution,
    difficulty: state.difficulty,
    createdAt: state.createdAt,
  };
}

 
             
                             
                        
                                                                                                                              
   
function getCell(state, index) {
  return {
    index,
    row: (index / SIZE) | 0,
    col: index % SIZE,
    value: state.values[index],
    status: state.status[index],
    isGiven: state.status[index] === CELL_GIVEN,
    isEmpty: state.values[index] === EMPTY,
    notes: maskToDigits(state.notes[index]),
  };
}

 
                         
                             
                        
                            
                                                                        
   
function setUserValue(state, index, value) {
  if (index < 0 || index >= CELLS) return { state, accepted: false, reason: 'index-out-of-range' };
  if (state.status[index] === CELL_GIVEN) return { state, accepted: false, reason: 'cell-is-given' };
  if (value !== EMPTY && !isValidPlacement(state.values, index, value)) {
    return { state, accepted: false, reason: 'conflict' };
  }
  const next = cloneState(state);
  next.values[index] = value;
  next.status[index] = value === EMPTY ? CELL_EMPTY : CELL_USER;
  next.notes[index] = 0;          
  return { state: next, accepted: true };
}

 
                  
                             
                        
                            
                         
   
function toggleNote(state, index, digit) {
  if (state.status[index] === CELL_GIVEN) return state;
  if (state.values[index] !== EMPTY) return state;               
  if (digit < 1 || digit > SIZE) return state;
  const next = cloneState(state);
  next.notes[index] ^= 1 << (digit - 1);
  if (next.notes[index] === 0) next.status[index] = CELL_EMPTY;
  return next;
}

 
              
                             
                        
                           
                         
   
function setNotes(state, index, digits) {
  if (state.status[index] === CELL_GIVEN || state.values[index] !== EMPTY) return state;
  const next = cloneState(state);
  next.notes[index] = digitsToMask(digits);
  return next;
}

 
                          
                             
                        
                                      
                         
   
function refreshNotes(state, index, exclude = []) {
  if (state.status[index] === CELL_GIVEN || state.values[index] !== EMPTY) return state;
  const next = cloneState(state);
  let mask = getCandidateMask(state.values, index);
  for (const d of exclude) mask &= ~(1 << (d - 1));
  next.notes[index] = mask;
  return next;
}

 
                
                             
                        
                         
   
function clearCell(state, index) {
  if (state.status[index] === CELL_GIVEN) return state;
  const next = cloneState(state);
  next.values[index] = EMPTY;
  next.notes[index] =0;
  next.status[index] = CELL_EMPTY;
  return next;
}

 
                  
                             
                         
   
function resetPlayerEntries(state) {
  const next = cloneState(state);
  for (let i = 0; i < CELLS; i++) {
    if (next.status[i] === CELL_GIVEN) continue;
    next.values[i] = EMPTY;
    next.notes[i] = 0;
    next.status[i] = CELL_EMPTY;
  }
  return next;
}

 
                             
                             
                                                                     
   
function snapshot(state) {
  return {
    values: Array.from(state.values),
    status: Array.from(state.status),
    notes: Array.from(state.notes),
  };
}

 
                                    
                             
                                                                                                   
                         
   
function restore(state, snap) {
  state.values.set(snap.values);
  state.status.set(snap.status);
  state.notes.set(snap.notes);
  return state;
}

 
            
                             
                                                                      
                                                                              
   
function getProgress(state) {
  let filled = 0;
  let given = 0;
  let user = 0;
  let correct = 0;
  let wrong = 0;
  for (let i = 0; i < CELLS; i++) {
    if (state.status[i] === CELL_GIVEN) {
      given++;
      filled++;
      if (state.solution && state.values[i] === state.solution[i]) correct++;
