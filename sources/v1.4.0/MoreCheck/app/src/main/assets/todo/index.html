<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6df6" />
  <meta name="description" content="待办清单：新增、勾选、删除、图片备注，全部保留，数据云端保存。" />
  <title>今日待办</title>
  <style>
    :root {
      --primary: #2f6df6;
      --wx: #07c160;
      --bg: #f2f4f8;
      --card: #ffffff;
      --text: #1c2330;
      --muted: #8a93a6;
      --line: #e7eaf0;
      --danger: #e5484d;
      --ok: #2bb673;
      --warn: #b7791f;
      --shadow: 0 8px 30px rgba(28, 35, 48, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* ⚠️ 满高不要指望视口单位（2026-10-29 真机实测）：本 WebView 里 `xx vh` 恒为 0px
       （新建 height:88vh 的探针 div 量出来也是 0），连 `height:100%` 都算成 0。
       所以底部弹窗的高度上限改用**百分比**——它相对的是 `position: fixed; inset: 0`
       的遮罩（高度确定，实测 695），这条路是通的；`vh` 会把弹窗压成只剩 padding 高，
       内容全部溢出到视口下方，表现就是"弹窗过低、点不到"。 */
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    /* 这一行的 100vh 在当前 WebView 里同样算成 0（见上面的说明），即"没有最小高度"，
       与本次弹窗问题无关，保持原样不动。 */
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .hidden { display: none !important; }

    /* ---------- Login ---------- */
    .login-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px 22px; }
    .brand { text-align: center; margin-bottom: 26px; }
    .brand .logo {
      width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 14px;
      background: linear-gradient(135deg, #2f6df6, #5b8dff); display: flex; align-items: center; justify-content: center;
      font-size: 32px; color: #fff; box-shadow: var(--shadow);
    }
    .brand h1 { font-size: 24px; margin: 0 0 6px; font-weight: 700; }
    .brand p { margin: 0; color: var(--muted); font-size: 14px; }

    .btn {
      border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer;
      background: var(--primary); color: #fff; transition: .15s; width: 100%;
    }
    .btn:active { transform: scale(.99); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.wb { background: var(--wx); margin-bottom: 10px; }
    .btn.wx { background: #1aad19; margin-bottom: 10px; }
    .btn.code { width: auto; white-space: nowrap; padding: 14px 16px; flex: 0 0 auto; }
    .btn.ghost { background: #eef2fa; color: #3d4a68; }
    .btn.danger { background: #fdeaea; color: var(--danger); }

    .divider { display: flex; align-items: center; color: var(--muted); font-size: 12px; margin: 18px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .divider span { padding: 0 12px; }

    .tabs { display: flex; background: var(--card); border-radius: 12px; padding: 4px; margin-bottom: 18px; box-shadow: var(--shadow); }
    .tabs button {
      flex: 1; border: 0; background: transparent; padding: 11px 0; font-size: 15px; font-weight: 600;
      color: var(--muted); border-radius: 9px; cursor: pointer; transition: .2s;
    }
    .tabs button.active { background: var(--primary); color: #fff; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .field .row { display: flex; gap: 10px; }
    input {
      width: 100%; padding: 14px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 12px;
      background: #fff; color: var(--text); outline: none; transition: border-color .15s;
    }
    input:focus { border-color: var(--primary); }
    .msg { font-size: 13px; margin-top: 12px; min-height: 18px; text-align: center; }
    .msg.err { color: var(--danger); }
    .msg.info { color: var(--ok); }
    .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
    .last-account {
      display: none; align-items: center; gap: 8px; background: #eef4ff; border: 1px solid #d6e4ff;
      border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; font-size: 13px; color: #2f5fd0;
    }
    .last-account.show { display: flex; }
    .last-account .txt { flex: 1; }

    /* ---------- App ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 5; background: linear-gradient(135deg, #2f6df6, #5b8dff);
      color: #fff; padding: 18px 18px 16px; border-radius: 0 0 22px 22px;
    }
    .topbar .title-row { display: flex; align-items: center; justify-content: space-between; }
    .topbar h2 { margin: 0; font-size: 20px; font-weight: 700; }
    .topbar .user { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .topbar .avatar {
      width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.25);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
      border: 0; padding: 0; overflow: hidden; cursor: pointer; color: #fff;
    }
    .topbar .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .topbar .logout { background: rgba(255,255,255,.18); border: 0; color: #fff; font-size: 12px;
      padding: 5px 10px; border-radius: 20px; cursor: pointer; }
    .topbar .date { font-size: 13px; opacity: .9; margin: 6px 0 12px; }
    .stat { display: flex; gap: 10px; }
    .stat .pill { background: rgba(255,255,255,.15); border-radius: 12px; padding: 8px 14px; flex: 1; }
    .stat .pill .n { font-size: 22px; font-weight: 700; line-height: 1.1; }
    .stat .pill .t { font-size: 12px; opacity: .9; }

    .filter-bar { display: flex; gap: 8px; padding: 14px 16px 2px; overflow-x: auto; }
    .chip {
      border: 1px solid var(--line); background: var(--card); color: var(--muted);
      border-radius: 20px; padding: 7px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    .add-bar { display: flex; gap: 10px; padding: 12px 16px 6px; }
    .add-bar input { flex: 1; }
    .add-bar .btn { width: auto; flex: 0 0 auto; padding: 14px 20px; }

    .list { list-style: none; margin: 8px 0 0; padding: 8px 14px 90px; }
    .group-title {
      font-size: 12px; color: var(--muted); padding: 14px 4px 6px; letter-spacing: .3px;
    }
    .item {
      display: flex; align-items: flex-start; gap: 12px; background: var(--card); border-radius: 14px;
      padding: 14px 14px; margin-bottom: 10px; box-shadow: 0 2px 10px rgba(28,35,48,.04);
      animation: pop .18s ease;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .check {
      width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); flex: 0 0 auto;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: .15s; background: #fff;
      margin-top: 2px;
    }
    .check.done { background: var(--ok); border-color: var(--ok); }
    .check.done svg { display: block; }
    .item .body { flex: 1; min-width: 0; }
    .item .text { font-size: 16px; word-break: break-word; }
    .item.done .text { color: var(--muted); text-decoration: line-through; }
    .item .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .item .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .item .thumbs img {
      width: 56px; height: 56px; object-fit: cover; border-radius: 8px; background: #f0f2f7;
      border: 1px solid var(--line); cursor: pointer;
    }
    .side-btns { display: flex; flex-direction: column; gap: 6px; align-items: center; }
    .icon-btn {
      border: 0; background: #f2f5fb; color: #5a6b8c; width: 32px; height: 32px;
      border-radius: 9px; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:active { background: #e6ebf5; }
    .icon-btn.danger:active { background: #fdeaea; }
    .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
    .empty .big { font-size: 40px; margin-bottom: 10px; }

    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #1c2330; color: #fff;
      padding: 11px 18px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); opacity: 0;
      transition: opacity .2s; pointer-events: none; max-width: 86%; text-align: center; z-index: 60;
    }
    .toast.show { opacity: 1; }
    /* 撤销条出现时把 toast 抬高一档，两者不叠在一起。 */
    .toast.above { bottom: 92px; }

    /* ---------- 一键登录（沿用打卡账号）---------- */
    .native-login {
      background: #eaf1ff; color: var(--primary); border: 1px solid #cddcff;
      display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px;
    }
    .native-login .tag {
      font-size: 11px; font-weight: 500; background: rgba(47, 109, 246, .14);
      border-radius: 6px; padding: 2px 6px;
    }
    .native-login:active { background: #dfe8ff; }

    /* ---------- 页面内二次确认（风格同本页按钮，不用系统弹窗）---------- */
    .confirm-mask {
      position: fixed; inset: 0; background: rgba(16, 22, 34, .45); z-index: 80;
      display: none; align-items: center; justify-content: center; padding: 24px;
    }
    .confirm-mask.show { display: flex; }
    .confirm-box {
      width: 100%; max-width: 340px; background: var(--card); border-radius: 18px;
      padding: 22px 20px 16px; box-shadow: var(--shadow); animation: pop .18s ease;
    }
    .confirm-box h3 { margin: 0 0 8px; font-size: 17px; font-weight: 700; }
    .confirm-box p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.55; }
    .confirm-actions { display: flex; gap: 10px; margin-top: 20px; }
    .confirm-actions .btn { padding: 12px; font-size: 15px; flex: 1; }
    .confirm-actions .btn.ghost { background: #f2f4f8; color: var(--text); border: 1px solid var(--line); }
    /* ⚠️ 必须显式写 color：#fff。上面已有 `.btn.danger { color: var(--danger) }`
       （浅红底 + 红字那套），只改 background 会得到"红底红字"= 看不见文字。 */
    .confirm-actions .btn.danger { background: var(--danger); color: #fff; }

    /* ---------- 长按图片的选项面板（保存 / 分享 / 删除）----------
       图片长按原本只有"直接保存"一个动作，用户想要"保存 or 分享"无从选择。
       这里用页面内的底部面板（不用系统弹窗：WebView 里的 alert/confirm 与
       本页风格不搭，而且原生 AlertDialog 会盖住灯箱的沉浸感）。 */
    .action-mask {
      position: fixed; inset: 0; background: rgba(16, 22, 34, .45); z-index: 75;
      display: none; align-items: flex-end; justify-content: center;
      opacity: 0; transition: opacity .16s ease;
    }
    .action-mask.show { display: flex; opacity: 1; }
    .action-sheet {
      width: 100%; max-width: 480px; background: var(--card);
      border-radius: 18px 18px 0 0; padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
      box-shadow: var(--shadow); box-sizing: border-box;
      transform: translateY(14px); transition: transform .18s ease;
    }
    .action-mask.show .action-sheet { transform: none; }
    .action-title {
      font-size: 12px; color: var(--muted); text-align: center; padding: 8px 4px 10px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .action-item {
      width: 100%; border: 0; background: transparent; color: var(--text);
      font-size: 16px; padding: 14px 10px; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .action-item:active { background: #eef2fa; }
    .action-item + .action-item { margin-top: 2px; }
    .action-item.danger { color: var(--danger); }
    .action-item.cancel { color: var(--muted); font-size: 15px; border-top: 1px solid var(--line);
      margin-top: 6px; border-radius: 0 0 12px 12px; }

    /* ---------- 删除撤销条 ----------
       ⚠️ 宽度必须靠 left+right 撑开，不能再写 `left:50% + translateX(-50%) + max-width`：
       fixed 元素在这种写法下取的是 **shrink-to-fit** 宽度，而里面的 `.txt` 是
       `flex: 1`（flex-basis:0），对容器的 max-content 贡献为 0 → 整条按"按钮宽度"收窄，
       文字被 ellipsis 截成「已删除 1 张备…」。改成左右各留 16px 后是满宽，
       文字有足够空间，长内容也只会吃掉自己的省略号。 */
    .undo-bar {
      position: fixed; left: 16px; right: 16px; bottom: 26px; transform: translateY(12px);
      display: flex; align-items: center; gap: 14px; background: #1c2330; color: #fff;
      padding: 12px 14px 12px 16px; border-radius: 14px; box-shadow: var(--shadow);
      font-size: 14px; opacity: 0; pointer-events: none; z-index: 65;
      transition: opacity .18s ease, transform .18s ease;
      box-sizing: border-box;
    }
    .undo-bar.show { opacity: 1; transform: none; pointer-events: auto; }
    .undo-bar .txt { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .undo-bar button {
      border: 0; background: rgba(255, 255, 255, .14); color: #9dc0ff; font-size: 14px; font-weight: 600;
      padding: 7px 12px; border-radius: 9px; cursor: pointer; flex: 0 0 auto;
    }

    /* ---------- 列表加载骨架（2026-10-30 需求 1）----------
       进页面时列表还没回来，原先是一片空白突然变出内容；改成三条灰条 + 呼吸动画，
       让「正在读」这件事本身可见。 */
    .skel-item {
      display: flex; align-items: flex-start; gap: 12px; background: var(--card); border-radius: 14px;
      padding: 14px; margin-bottom: 10px;
    }
    .skel-dot { width: 24px; height: 24px; border-radius: 50%; flex: 0 0 auto; margin-top: 2px; }
    .skel-lines { flex: 1; min-width: 0; }
    .skel-line { height: 13px; border-radius: 7px; }
    .skel-line + .skel-line { margin-top: 9px; }
    .skel-dot, .skel-line {
      background: linear-gradient(90deg, #eef1f7 25%, #e3e8f2 37%, #eef1f7 63%);
      background-size: 400% 100%; animation: skel 1.3s ease-in-out infinite;
    }
    @keyframes skel { from { background-position: 100% 50%; } to { background-position: 0 50%; } }

    /* ---------- 缩略图占位（2026-10-30 需求 1）----------
       签名 URL 是异步取的：先放一个同尺寸的灰块，取到再填图。
       原先直接塞一个没有 src 的 <img>，会先出现"破图/空白方块"再跳成图片。 */
    .item .thumbs .thumb {
      width: 56px; height: 56px; border-radius: 8px; border: 1px solid var(--line);
      background: linear-gradient(90deg, #eef1f7 25%, #e3e8f2 37%, #eef1f7 63%);
      background-size: 400% 100%; animation: skel 1.3s ease-in-out infinite;
      overflow: hidden; cursor: pointer; flex: 0 0 auto;
    }
    .item .thumbs .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item .thumbs .thumb.ready { animation: none; background: #f0f2f7; }

    /* ---------- 空内容提示：输入框抖一下 + 变红（2026-10-30 需求 2）---------- */
    .add-bar input.warn {
      border-color: var(--danger); background: #fff6f6; animation: shake .32s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(2px); }
    }
    /* 「添加」按钮的转圈：文字先隐藏，避免按钮在 2 行文字 / 1 个圈之间跳高。 */
    .add-bar .btn.busy { color: transparent; position: relative; pointer-events: none; }
    .add-bar .btn.busy::after {
      content: ''; position: absolute; left: 50%; top: 50%; width: 17px; height: 17px; margin: -9px 0 0 -9px;
      border: 2px solid rgba(255, 255, 255, .45); border-top-color: #fff; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- 个人简介 ---------- */
    .sheet-mask {
      position: fixed; inset: 0; background: rgba(16, 22, 34, .45); z-index: 50;
      display: none; align-items: flex-end; justify-content: center;
    }
    .sheet-mask.show { display: flex; }
    .sheet {
      width: 100%; max-width: 480px; background: var(--bg); border-radius: 20px 20px 0 0;
      /* 88% 而不是 88vh：遮罩是 fixed + inset:0（高度确定），百分比才有得算；
         vh 在本 WebView 里恒为 0，会把整个弹窗压成 44px 高、内容溢出到屏幕外。 */
      padding: 20px 18px calc(24px + env(safe-area-inset-bottom)); max-height: 88%; overflow-y: auto;
      animation: rise .22s ease;
    }
    @keyframes rise { from { transform: translateY(18px); opacity: .6; } to { transform: none; opacity: 1; } }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sheet-head h3 { margin: 0; font-size: 17px; font-weight: 700; }
    .sheet-close { border: 0; background: #e9edf6; color: #5a6b8c; width: 30px; height: 30px;
      border-radius: 50%; font-size: 18px; cursor: pointer; line-height: 1; }
    .profile-card { background: var(--card); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
    .profile-top { display: flex; align-items: center; gap: 14px; }
    .profile-avatar {
      width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #2f6df6, #5b8dff);
      color: #fff; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;
      overflow: hidden; border: 0; cursor: pointer; flex: 0 0 auto;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .profile-name .edit { font-size: 12px; color: var(--primary); font-weight: 500; cursor: pointer; }
    .profile-sign { font-size: 13px; color: var(--muted); margin-top: 4px; word-break: break-word; }
    .profile-rows { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 8px; }
    .profile-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px; }
    .profile-row .k { color: var(--muted); flex: 0 0 auto; }
    .profile-row .v { color: var(--text); word-break: break-all; text-align: right; }
    .profile-stats { display: flex; gap: 10px; margin-top: 14px; }
    .profile-stats .box { flex: 1; background: #f5f7fc; border-radius: 12px; padding: 10px; text-align: center; }
    .profile-stats .box .n { font-size: 20px; font-weight: 700; }
    .profile-stats .box .t { font-size: 12px; color: var(--muted); }
    .profile-actions { margin-top: 14px; display: flex; gap: 10px; }
    .profile-actions .btn { padding: 12px; font-size: 15px; }
    .edit-field { margin-top: 12px; }
    .edit-field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .edit-field input { margin-bottom: 10px; }

    /* ---------- 图片灯箱 ---------- */
    .viewer {
      position: fixed; inset: 0; background: rgba(10, 14, 22, .94); z-index: 70;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      /* 打开动画：遮罩淡入。图片自己再走一层"缩放到 1"（见下图 .loaded）。 */
      opacity: 0; transition: opacity .16s ease;
    }
    .viewer.show { display: flex; opacity: 1; }
    /* 78%：父级 .viewer 是 fixed + inset:0，高度确定；78vh 在本 WebView 里是 0，图片会看不见。 */
    .viewer img {
      max-width: 100%; max-height: 78%; object-fit: contain;
      /* 图片加载完成才置 .loaded：否则先看到一块"空黑"再突然跳出整张图。 */
      opacity: 0; transform: scale(.94);
      transition: opacity .18s ease, transform .2s cubic-bezier(.2, .8, .2, 1);
      /* 长按图片时不要弹系统的"存储/分享图片"菜单，也不要选中文字：
         保存走页面自己的长按判定（见 bindViewerGestures）。 */
      -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    }
    .viewer img.loaded { opacity: 1; transform: none; }
    .viewer-bar { position: absolute; top: 14px; right: 14px; display: flex; gap: 10px; }
    .viewer-bar button {
      border: 0; background: rgba(255,255,255,.18); color: #fff; width: 36px; height: 36px;
      border-radius: 50%; font-size: 18px; cursor: pointer; line-height: 1;
    }
    .viewer-tip { color: rgba(255,255,255,.7); font-size: 12px; margin-top: 14px; }

    /* ── Android 内嵌适配（MoreCheck 实验室）：────────────────────────

<body>

  <div id="toast" class="toast"></div>

  <!-- SDK 本地自托管：不依赖外部 CDN。

       2026-10-31 上线网页版：发布后的站点是「分享链接」形态
       （`…/?sharecode=xxx`），**静态资源也必须带同一个 sharecode**，否则服务器
       直接返回 403「链接不完整」——现象就是页面一片空白（SDK 没加载，脚本整体抛错）。
       所以这里用 document.write 把当前查询串原样拼给 SDK 的 URL；
       在 App 的 WebView 里没有查询串，拼出来与原来完全一致。 -->
  <script>
    (function () {
      var q = location.search || '';
      document.write('<scr' + 'ipt src="./workbuddy-cloud-sdk.js' + q + '"><\/scr' + 'ipt>');
    })();
  </script>
  <script>
    (function () {
      /* ── 2026-10-29 账号合并 ─────────────────────────────────────────
       * 本页原来连的是独立的「今日待办」云应用（today-todo-50052）。现在改成
       * **打卡那个云应用**（morecheck-sync）：
       *
       *   一个云应用 = 一个用户池 = 一个 auth.uid()。
       *   三处登录的是同一个账号，数据落在同一个库里，原生侧那份会话也能直接给本页用。
       *
       * endpoint / publishableKey 必须与 `CloudConfig.kt` 里的一模一样：
       * 客户端标识不同 = 会话被判「issued for another client」= 一律 401。
       * 换 Key 时**两处一起改**（Kotlin 一处、这里一处）。
       * ─────────────────────────────────────────────────────────────── */
      var publicConfig = {
        endpoint: "https://morecheck.app.workbuddy.host",
        oauthRelayBaseUrl: "https://www.workbuddy.cn/v2/as/genie-baas/oauth",
        publishableKey: "wbpk_pQB4MT3Hax2MFbWqH3Xj3t_t00dgUklIh0YkkkzDq1LaCh7jib8AhAn"
      };

      var cloud = null;
      var tab = 'phone';
      var todos = [];
      var loadingTodos = false;   // true = 正在读列表（首屏铺骨架用，2026-10-30 需求 1）
      var imagesByTodo = {};      // todoId -> [imageRow]
      var signedUrlCache = {};    // path -> {url, at}
      /* 列表指纹：内容没变就不重建 DOM（见 render / listSignature）。 */
      var lastListSig = null;
      var profile = { nickname: '', signature: '', avatar_path: '' };
      var currentUser = null;
      var filter = 'all';
      var pendingOtp = null;
      var sending = false;
      var countdownTimer = null;
      var viewerImageId = null;
      var sessionRestored = false;

      var SESSION_PREFIX = 'workbuddy-cloud.session.';
      var LAST_ACCOUNT_KEY = 'todo.lastAccount';

      function $(id) { return document.getElementById(id); }

      /* ================================================================
       * 原生桥（MoreCheck 注入 window.__CIM_TODO__）
       *
       * 约定：任何方法都不存在时全部走 no-op 回退，因此同一份页面

      var Native = {

        available: function () {
